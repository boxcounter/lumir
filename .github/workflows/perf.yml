name: perf

# 性能合同测量（ADR 0002 §6，方法学本体见 docs/specs/perf-measurement.md）。
# 2026-09-05 一次性校准后 enforce=true：绝对模式（open-1mb-file/resident-memory）超阈拒合；
# 相对回归模式（cold-start/keypress-to-paint）对照 actions/cache 滚动基线，回退超「该指标」容忍线拒合
# （容忍线逐指标、随基线窗口实测散布浮动；统计口径与容忍线以 docs/specs/perf-measurement.md
# 「相对回归门禁」为准，此处不重复数字）；结果缺失即 exit 1。
# 基线推进逐指标解耦（M174）：写回条件为 always()，是否推进由 update-baseline.mjs 读
# .local/perf/gate-status.json 逐指标裁决——任一指标确定性超阈不再连带冻结其它指标的滚动基线。

on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/perf/**"
      - "tests/perf/**"
      - ".github/workflows/perf.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/perf/**"
      - "tests/perf/**"
      - ".github/workflows/perf.yml"
  workflow_dispatch: # 校准期手动跑数

permissions:
  contents: read

jobs:
  measure:
    name: 四项指标测量
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 恢复滚动基线（相对回归门禁用；缺失则首次/重建期，比较跳过不拒合）
        uses: actions/cache/restore@v4
        with:
          path: .local/perf/baseline/
          key: perf-baseline-${{ github.run_id }}
          restore-keys: perf-baseline-

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 全局 WebSocket（CDP client 用）需 >= 22.4
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 常驻内存归因护栏与 keypress 注入起点门禁的纯函数夹具（node:test，零依赖、毫秒级）：
      # 前者守 resident-memory 门禁读数可信度，后者守 keypress-to-paint 的注入起点（readyState
      # complete 但产品未挂载时不得开始采样——启动期样本会把主 chunk 装载算进按键读数）。
      # 两者都必须在构建与测量之前失败，而不是等读数出来才发现；任一文件失败即本 step 红。
      # step 名沿用 M723 的叫法（口径见 docs/specs/perf-measurement.md §5），内容以 run 行为准。
      # fixture 在 tests/perf/fixtures/memory-contamination-cases.json；paths 已含 scripts/perf/** 与 tests/perf/**。
      - name: 常驻内存归因护栏夹具测试（node:test，零依赖）
        run: node --test scripts/perf/memory.test.mjs scripts/perf/keypress-startup.test.mjs

      - name: 构建前端产物（dist/，keypress-to-paint 的负载）
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 构建 release 二进制（冷启动与内存测量的对象）
        run: cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml

      - name: 冷启动 <300ms
        run: node scripts/perf/cold-start.mjs

      - name: keypress-to-paint <16ms（headless 注入近似，下界）
        run: node scripts/perf/keypress-to-paint.mjs

      - name: 打开 1MB 文件 <100ms（占位口径且已 enforce：只量磁盘 IO + UTF-8 解码，非真实打开端点）
        # 张力如实标注（M153）：这条 step 量的是「读 1MB 到内存」，不是「打开请求 → 首帧渲染」；
        # 而 check-thresholds.mjs 对它就 enforce（绝对模式，contract 100ms）。
        # 阈值有效、数字稳定，但不代表用户可感知的打开耗时；修订义务在脚本文件头。
        run: node scripts/perf/open-file.mjs

      - name: 常驻内存 <250MB（门禁阈值）
        # M174 提阈：200→250MB。依据 = 抽样 9 次 master perf run，该项 9/9 确定性超阈、读数
        # 206.50–215.28MB（非抖动；2026-09-05 校准值约 110MB，稳态翻倍），250 给 ≥16% 头顶余量。
        # 性质：这是「门禁阈值」的修订，不占用 ADR 0002 §6 的一次性校准额度；ADR 0002 §6 的文本
        # 仍写 200MB，其修订是本 change 的显式后续项（记在 spec §4 与 review-request）。artifact 的
        # contract 字段仍记合同值 200MB，门禁阈值见 thresholds.json / gate-status.json。
        run: node scripts/perf/memory.mjs

      - name: 阈值比较（enforce：超阈/相对回归超容忍线/结果缺失即红；判据落盘 .local/perf/gate-status.json）
        if: always()
        run: node scripts/perf/check-thresholds.mjs

      # `include-hidden-files` 必须显式打开：产出根 `.local/perf/` 本身就是隐藏目录，
      # upload-artifact v4 默认跳过隐藏文件——不开这一项会得到一个空 artifact，而 run 照绿。
      - name: 上传数值 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: .local/perf/
          retention-days: 30
          include-hidden-files: true

      # 条件由 success() 改为 always()（M174）：基线推进必须与「整个 run 是否全绿」解耦。
      # 原口径下任一指标确定性超阈（M172：resident-memory 9/9 超阈 206.50–215.28MB）⇒ run 永不 success
      # ⇒ 全部相对基线永久冻结，keypress-to-paint 长期对着单样本基线 28.15ms 比较（日志「最近 1 次 master」）。
      # 是否推进改由脚本逐指标裁决（读上一 step 落盘的 gate-status.json：fail 不进基线、pass/skip 进，
      # 判据缺失则 fail-closed 一条不进），读数异常与否的判定权仍在 check-thresholds.mjs 一处。
      - name: 更新滚动基线（master push；逐指标解耦，fail 的指标不进）
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node scripts/perf/update-baseline.mjs

      - name: 写回基线 cache
        # 同样用 always()：上一步已逐指标裁决完毕，此处只负责持久化它写回的文件
        # （update-baseline.mjs 无论是否推进都会把基线文件写出来，save 总有路径可取）。
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: .local/perf/baseline/
          key: perf-baseline-${{ github.run_id }}
