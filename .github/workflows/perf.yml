name: perf

# 性能合同测量（ADR 0002 §6，方法学本体见 docs/specs/perf-measurement.md）。
# 2026-09-05 一次性校准后 enforce=true：绝对模式（open-1mb-file/resident-memory）超阈拒合；
# 相对回归模式（cold-start/keypress-to-paint）对照 actions/cache 滚动基线，回退超容忍线拒合
# （统计口径与容忍线以 docs/specs/perf-measurement.md「相对回归门禁」为准，此处不重复数字）；
# 结果缺失即 exit 1。基线仅 master push 全绿后由 update-baseline.mjs 写回。

on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/perf/**"
      - "tests/perf/**"
      - ".github/workflows/perf.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/perf/**"
      - "tests/perf/**"
      - ".github/workflows/perf.yml"
  workflow_dispatch: # 校准期手动跑数

permissions:
  contents: read

jobs:
  measure:
    name: 四项指标测量
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 恢复滚动基线（相对回归门禁用；缺失则首次/重建期，比较跳过不拒合）
        uses: actions/cache/restore@v4
        with:
          path: perf-results/baseline/
          key: perf-baseline-${{ github.run_id }}
          restore-keys: perf-baseline-

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 全局 WebSocket（CDP client 用）需 >= 22.4
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端产物（dist/，keypress-to-paint 的负载）
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 构建 release 二进制（冷启动与内存测量的对象）
        run: cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml

      - name: 冷启动 <300ms
        run: node scripts/perf/cold-start.mjs

      - name: keypress-to-paint <16ms（headless 注入近似，下界）
        run: node scripts/perf/keypress-to-paint.mjs

      - name: 打开 1MB 文件 <100ms（占位口径）
        run: node scripts/perf/open-file.mjs

      - name: 常驻内存 <200MB
        run: node scripts/perf/memory.mjs

      - name: 阈值比较（enforce：超阈/相对回归超容忍线/结果缺失即红）
        if: always()
        run: node scripts/perf/check-thresholds.mjs

      - name: 上传数值 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf-results/
          retention-days: 30

      - name: 更新滚动基线（仅 master push 且全绿）
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node scripts/perf/update-baseline.mjs

      - name: 写回基线 cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: perf-results/baseline/
          key: perf-baseline-${{ github.run_id }}
