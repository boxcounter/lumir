name: docs-check

# 制品门禁：ADR 与 OpenSpec 的结构与合法性校验 + 验收场景静态契约与覆盖表 + backlog 出口门禁
# + 验收套件语法与自测（不起真机）。
# 口径本体见 docs/process/adr-lifecycle.md 与 docs/process/openspec-workflow.md。

on:
  pull_request:
    paths:
      - "docs/**"
      - "openspec/**"
      # 验收套件：场景、覆盖表、runner / lib、静态契约与自测入口的改动都必须触发本 job；
      # 真机行为不进 CI，秒级契约检查与 node:test 自测经 check-suite.sh 统一执行。
      - "scripts/acceptance/scenarios/**"
      - "scripts/acceptance/COVERAGE.md"
      - "scripts/acceptance/*.mjs"
      - "scripts/acceptance/lib/**"
      - "scripts/acceptance/check-syntax.sh"
      - "scripts/acceptance/check-suite.sh"
      - "scripts/docs-check.sh"
      # backlog 出口门禁（M692）：判据实现自身的改动同样要触发 docs-check。
      - "scripts/backlog-check.mjs"
      # openspec 判据实现：链接可达性、归档对账、归档修链包装器及其中两处 node:test 自测。
      # 只改这些判据实现的 PR 也必须触发本 job，否则判据退化可以无门禁合入（M789）。
      - "scripts/openspec-links.sh"
      - "scripts/openspec-archive-check.mjs"
      - "scripts/openspec-archive-check.test.mjs"
      - "scripts/openspec-archive.mjs"
      - "scripts/openspec-archive.test.mjs"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "openspec/**"
      - "scripts/acceptance/scenarios/**"
      - "scripts/acceptance/COVERAGE.md"
      - "scripts/acceptance/*.mjs"
      - "scripts/acceptance/lib/**"
      - "scripts/acceptance/check-syntax.sh"
      - "scripts/acceptance/check-suite.sh"
      - "scripts/docs-check.sh"
      - "scripts/backlog-check.mjs"
      - "scripts/openspec-links.sh"
      - "scripts/openspec-archive-check.mjs"
      - "scripts/openspec-archive-check.test.mjs"
      - "scripts/openspec-archive.mjs"
      - "scripts/openspec-archive.test.mjs"
      - ".github/workflows/docs-check.yml"

permissions:
  contents: read

jobs:
  adr:
    name: ADR 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 依赖（M690 r1）：覆盖表校验经 coverage.mjs → lib/execute.mjs 导入根 dependencies 的
      # `js-yaml`。干净 runner 没有 node_modules，不装依赖会 ERR_MODULE_NOT_FOUND；口径与本仓
      # visual.yml / perf.yml 一致（pnpm/action-setup + setup-node + frozen lockfile）。
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（frozen lockfile）
        run: pnpm install --frozen-lockfile

      # 校验实现只有一份：scripts/docs-check.sh —— 本地 scripts/gate.sh quick 调的是同一
      # 脚本（AI-only 模式下「本地全绿才允许提交」要求两边同一条命令；此前两处各写一遍，
      # 本地根本没有 ADR 结构校验，M153 收敛到这里）。
      # 该脚本内含八条判据：docs/adr/ 文件结构（M153）、docs/adr/README.md 索引双向一致（M153）、
      # openspec/**/*.md 相对链接可达性（M409，实现 scripts/openspec-links.sh —— `openspec archive`
      # 移深一层目录却不重写制品内相对链接，`openspec validate` 又不查链接，故单列一条判据）、
      # OpenSpec 归档对账（M569，实现 scripts/openspec-archive-check.mjs —— `openspec archive` 对
      # MODIFIED requirement 整块替换，delta 少抄的段落会被静默删除、validate 看不见）、归档队列
      # （M684，同一脚本的门禁模式：tasks 全勾的活跃 change 必须在 docs/backlog.md 有且仅有一条归档
      # 跟踪条目，缺失或重复报红；口径见 docs/process/openspec-workflow.md「批次收尾 checklist」）、
      # 验收场景契约与覆盖表（全部场景经 checkScenario；COVERAGE.md 与 front-matter 一致）、
      # backlog 出口门禁（M692，实现 scripts/backlog-check.mjs：待修 / 已立项 / 待真机验收区出现完成标记仍留条目、活项缺下一动作 /
      # 关闭条件、同一 finding 指针重复、finding 指针不存在、记录在案无 canonical 指针 / 复核口径、
      # 全文超 80 行 ⇒ 报红；条目年龄只进报告。无 ratchet、无既有豁免；口径见
      # docs/process/openspec-workflow.md「backlog 出口的机器判据」），以及验收套件语法与自测
      # （组数不在此写死：清单的真源是 check-suite.sh 本身）。
      # 验收部分统一走 scripts/acceptance/check-suite.sh，与本地 gate.sh quick 的 acceptance-suite
      # 门共用；不起 app、不占端口、不碰验收 vault。八条都随本步继承。
      # job 名 `ADR 校验` 保持原样：它可能被 GitHub 的分支保护登记为必需检查，改名会让保护规则失配。
      - name: 制品校验（ADR / OpenSpec / 归档 / backlog / 验收场景契约与套件自测，与本地 gate.sh 共用 scripts/docs-check.sh）
        run: bash scripts/docs-check.sh

  openspec:
    name: OpenSpec 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验目录结构与 change 制品完整
        run: |
          set -euo pipefail
          fail=0
          [ -f openspec/config.yaml ] || { echo "::error::缺少 openspec/config.yaml"; fail=1; }
          [ -d openspec/specs ] || { echo "::error::缺少 openspec/specs/"; fail=1; }
          [ -d openspec/changes/archive ] || { echo "::error::缺少 openspec/changes/archive/"; fail=1; }
          shopt -s nullglob
          for d in openspec/changes/*/; do
            name=$(basename "$d")
            [ "$name" = "archive" ] && continue
            for artifact in proposal.md tasks.md; do
              if [ ! -f "$d$artifact" ]; then
                echo "::error::change '$name' 缺少必填制品 $artifact（清单见 docs/process/openspec-workflow.md）"
                fail=1
              fi
            done
            if [ ! -d "${d}specs" ]; then
              echo "::error::change '$name' 缺少 specs/ 增量目录"
              fail=1
            fi
          done
          exit $fail
      - name: openspec validate --all --strict
        run: npx --yes @fission-ai/openspec@1.12.0 validate --all --strict
