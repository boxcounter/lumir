name: docs-check

# 制品门禁：ADR 与 OpenSpec 的结构与合法性校验 + 验收场景覆盖表生成一致性。
# 口径本体见 docs/process/adr-lifecycle.md 与 docs/process/openspec-workflow.md。

on:
  pull_request:
    paths:
      - "docs/**"
      - "openspec/**"
      # 验收覆盖表（M690）：场景改动必须同步重生成 COVERAGE.md，生成器与它直接复用的
      # 解析器（lib/execute.mjs）/ 运行期路径模块（lib/util.mjs）、门禁脚本自身的改动也要让
      # 这条校验跑起来（`scripts/acceptance/run.mjs --check` 调同一实现，但套件不进 CI）。
      - "scripts/acceptance/scenarios/**"
      - "scripts/acceptance/COVERAGE.md"
      - "scripts/acceptance/coverage.mjs"
      - "scripts/acceptance/lib/execute.mjs"
      - "scripts/acceptance/lib/util.mjs"
      - "scripts/docs-check.sh"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "openspec/**"
      - "scripts/acceptance/scenarios/**"
      - "scripts/acceptance/COVERAGE.md"
      - "scripts/acceptance/coverage.mjs"
      - "scripts/acceptance/lib/execute.mjs"
      - "scripts/acceptance/lib/util.mjs"
      - "scripts/docs-check.sh"
      - ".github/workflows/docs-check.yml"

permissions:
  contents: read

jobs:
  adr:
    name: ADR 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 依赖（M690 r1）：覆盖表校验经 coverage.mjs → lib/execute.mjs 导入根 dependencies 的
      # `js-yaml`。干净 runner 没有 node_modules，不装依赖会 ERR_MODULE_NOT_FOUND；口径与本仓
      # visual.yml / perf.yml 一致（pnpm/action-setup + setup-node + frozen lockfile）。
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（frozen lockfile）
        run: pnpm install --frozen-lockfile

      # 校验实现只有一份：scripts/docs-check.sh —— 本地 scripts/gate.sh quick 调的是同一
      # 脚本（AI-only 模式下「本地全绿才允许提交」要求两边同一条命令；此前两处各写一遍，
      # 本地根本没有 ADR 结构校验，M153 收敛到这里）。
      # 该脚本内含六条判据：docs/adr/ 文件结构（M153）、docs/adr/README.md 索引双向一致（M153）、
      # openspec/**/*.md 相对链接可达性（M409，实现 scripts/openspec-links.sh —— `openspec archive`
      # 移深一层目录却不重写制品内相对链接，`openspec validate` 又不查链接，故单列一条判据）、
      # OpenSpec 归档对账（M569，实现 scripts/openspec-archive-check.mjs —— `openspec archive` 对
      # MODIFIED requirement 整块替换，delta 少抄的段落会被静默删除、validate 看不见）、归档队列
      # （M684，同一脚本的门禁模式：tasks 全勾的活跃 change 必须在 docs/backlog.md 有且仅有一条归档
      # 跟踪条目，缺失或重复报红；口径见 docs/process/openspec-workflow.md「批次收尾 checklist」），
      # 以及验收场景覆盖表（M690，实现 scripts/acceptance/coverage.mjs：COVERAGE.md 必须与
      # scenarios/*.md 的 front-matter 一致；id / item / title 必填、id 唯一、item 在覆盖表内
      # 一项一行（场景间共用 item 合法），title 不要求唯一）。
      # 六条都随本步继承。
      # job 名 `ADR 校验` 保持原样：它可能被 GitHub 的分支保护登记为必需检查，改名会让保护规则失配。
      - name: 制品校验（ADR 结构 / README 索引 / OpenSpec 相对链接 / 归档对账 / 归档队列 / 验收覆盖表，与本地 gate.sh 共用 scripts/docs-check.sh）
        run: bash scripts/docs-check.sh

  openspec:
    name: OpenSpec 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验目录结构与 change 制品完整
        run: |
          set -euo pipefail
          fail=0
          [ -f openspec/config.yaml ] || { echo "::error::缺少 openspec/config.yaml"; fail=1; }
          [ -d openspec/specs ] || { echo "::error::缺少 openspec/specs/"; fail=1; }
          [ -d openspec/changes/archive ] || { echo "::error::缺少 openspec/changes/archive/"; fail=1; }
          shopt -s nullglob
          for d in openspec/changes/*/; do
            name=$(basename "$d")
            [ "$name" = "archive" ] && continue
            for artifact in proposal.md tasks.md; do
              if [ ! -f "$d$artifact" ]; then
                echo "::error::change '$name' 缺少必填制品 $artifact（清单见 docs/process/openspec-workflow.md）"
                fail=1
              fi
            done
            if [ ! -d "${d}specs" ]; then
              echo "::error::change '$name' 缺少 specs/ 增量目录"
              fail=1
            fi
          done
          exit $fail
      - name: openspec validate --all --strict
        run: npx --yes @fission-ai/openspec@1.12.0 validate --all --strict
