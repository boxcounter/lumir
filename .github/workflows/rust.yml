name: rust

# Rust 质量门禁（架构复查 P1-3）：AI-only 模式下 CI 是唯一防线（ADR 0004）。
# fmt --check + clippy -D warnings + test 三个都必须绿；cargo test 同时是
# ADR 0003 §4 fixture 测试集与 ts-rs bindings 导出（src/bindings/ 生成物入仓）的载体。

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/bindings/**"
      - ".github/workflows/rust.yml"
  push:
    branches: [master]
    paths:
      - "src-tauri/**"
      - "src/bindings/**"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

jobs:
  gate:
    name: fmt + clippy + test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: ts-rs bindings 无漂移（cargo test 重导出后须与仓内一致，含未跟踪的新文件）
        run: |
          set -euo pipefail
          # 判据是「工作区相对索引的任何差异」，不是 git diff：后者只看已跟踪文件，
          # ts-rs 新导出的 bindings 文件（untracked）不会让它报红——正是最常见的漂移形态。
          dirty=$(git status --porcelain -- src/bindings/)
          if [ -n "$dirty" ]; then
            echo "::error::src/bindings/ 有漂移（未提交的修改或未跟踪的新文件）："
            printf '%s\n' "$dirty"
            exit 1
          fi

      - name: tauri gen/schemas 无漂移（cargo 构建重生成后须与仓内一致，含未跟踪的新文件）
        run: |
          set -euo pipefail
          # tauri-build 每次构建都会按当前依赖的 ACL 能力面重写 gen/schemas/*.json；不提交就会
          # 每次构建弄脏工作区，且 schema 与真实能力面脱节。与本地 scripts/gate.sh 的
          # schemas-drift 同口径：工作区相对索引的任何差异都算漂移（git diff 看不见 untracked）。
          dirty=$(git status --porcelain -- src-tauri/gen/schemas/)
          if [ -n "$dirty" ]; then
            echo "::error::src-tauri/gen/schemas/ 有漂移（tauri-build 重生成结果与仓内不一致）："
            printf '%s\n' "$dirty"
            exit 1
          fi
