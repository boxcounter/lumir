schema: spec-driven

context: |
  Language: zh
  All artifacts must be written in zh.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

# Per-artifact rules：与 docs/process/openspec-workflow.md 的制品清单一一对应
rules:
  proposal:
    - 模板为 docs/process/templates/proposal.md，必须含 Why / What Changes / Non-goals 三节
    - 评审标准是 Alex 不看代码即可裁决，proposal 不得依赖实现细节才能读懂
    - 事实性断言须附信源
  tasks:
    - 模板为 docs/process/templates/tasks.md，任务原子化、可勾选
    - 末尾须有验证分组，含 validate --all --strict 与该 change 的验收动作
operations:
  archive:
    guidance:
      - 归档前确认节点 2 五要件齐：方案已批准、独立 reviewer clean/merge、tasks 完成或标注放弃理由、要求的门禁与真机证据通过、规格对账无丢段——齐即由 tower 归档
      - 只有价值 / 行为裁决未决、审美手感、影响面升级、评审异常、证据缺口五类例外才送 Alex；判据以 docs/process/openspec-workflow.md 为 canonical
      - tasks 全部勾选或标注放弃原因后才可 archive
