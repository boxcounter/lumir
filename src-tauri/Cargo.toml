[package]
name = "lumir"
version = "0.8.0"
edition = "2021"
description = "Lumir — skeleton shell (M0 harness)"
license = "MIT"

[lib]
name = "lumir_lib"
# 只要 rlib：staticlib/cdylib 是 Tauri mobile 模板残留，移动端是 ADR 0001 非目标；
# 多 crate-type 会让每次构建（含 perf CI 的 release 构建）白付链接时间。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# session id 的随机段（rand 已在依赖树内 transitive 存在，直接引用零新增编译重量）。
rand = "0.10"
# 本地时间换算（change add-cron-runtime-daemon，design §4.3）：定时任务的「今天」与「到点」
# 都按**本机本地时间**判定，`chrono::Local` 是 std 之外唯一可用的偏移来源。锁文件里已有
# chrono 0.4（transitive），本项只是把它提升为直接依赖，零新增编译重量。
# `default-features = false`：默认档带 wasm 绑定（wasmbind → wasm-bindgen / js-sys），本仓
# 不编 wasm；只开 clock（`Local` 的时区来源）与 std。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# payload 类型单一来源选型：ts-rs（而非 specta / tauri-specta）。
# 理由：单 crate、无运行时开销、bindings 由 cargo test 顺带导出（契合 rust.yml 门禁）；
# specta 方案需同时引入 specta + tauri-specta 且强绑定其 builder，本阶段契约只是薄约定，
# 只需要"类型一处定义、TS 自动生成"，不需要它生成的 invoke wrapper。取舍详见 commands.rs 模块文档。
ts-rs = "11"
sha2 = "0.10"
# 子代理定义文件的 frontmatter 解析（change add-harness-subagents tasks §2.1）：只解析标量 +
# 字符串列表 + 注释子集，产出窄结构体，不走宽松反序列化。
#
# **为什么是 saphyr 而不是 yaml-rust2**：`serde_yaml` 已 deprecated（0.9.34+deprecated，2024-03
# 后无更新）。yaml-rust2 0.13 的 README 自述「只做基础维护、保留稳定 API」，新特性归 saphyr
# （同作者、同仓库谱系的继任者，0.2.x）；本仓只在定义文件这一处消费 YAML，API 稳定性不是取舍点，
# 维护方向才是——选继任者，避免下一次 YAML 修复落不到已冻结的 API 上。两者的解析质量同源
# （同一份 YAML 1.2 实现谱系），saphyr 多出的传递依赖（saphyr-parser / ordered-float / thiserror）
# 都是小 crate，编译重量可忽略。
#
# `default-features = false`：默认档带 `encoding`（encoding_rs）——定义文件是 UTF-8，本仓不读
# 别的编码，关掉避免白付依赖。
saphyr = { version = "0.2", default-features = false }
# 剪贴板图片转码（change paste-clipboard-image，design §4）：png 解码 + **无损 WebP** 编码。
# 用 `default-features = false` 只开需要的两个格式 feature——默认格式集含 avif（ravif）、tiff 等
# 本 change 用不到的重依赖，开着会白付编译与二进制体积。两条链路都是纯 Rust（`image-webp` +
# `png`），零 C 依赖、零外部进程，不引入构建面。
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
# 系统通知（change add-cron-runtime-daemon §4）：cron 的「到点 / 已完成 / 运行失败」投递与
# 点击唤起。用插件的 **Rust 侧 API**（`app.notification()`）而非前端 JS API：通知的投递点在
# `lumir-cron` 线程上，点击回调也要在进程侧常驻——capabilities 因此零增量（与 opener / rfd
# 同一取舍先例）。
#
# **版本钉死 2.6.0**：桌面点击回调（`on_action` / `wait_for_response`）自 2.6.0 起才有。
# 代价（如实登记）：该版本自身要求 `tauri = "2.12"`，锁文件因此把 tauri 从 2.11.5 抬到
# 2.12.4，与 npm 侧 `@tauri-apps/api` / `@tauri-apps/cli` 的 2.11.x 形成 minor 不匹配——
# tauri-cli 会打印一条 "version mismatched Tauri packages" 警告（非致命，真机验收已跑通），
# 收口需要把 package.json 的两个 @tauri-apps 包一并升到 2.12.x（不在本 mission 的改动面）。
tauri-plugin-notification = "=2.6.0"
# vault watch（add-vault-workspace）：notify 8 稳定线（9.x 仍是 rc）。
notify = "8"
# 目录选择器：rfd 纯 Rust 原生 dialog，不需要 tauri-plugin-dialog 的
# tauri.conf.json / capabilities 配置（那不在本 change 的改动面内）。
rfd = "0.17"
# 外链打开（M144）：交给系统默认应用（macOS 走 NSWorkspace 等价路径），跨平台语义
# 由插件持有，不自己拼 `open` 命令。
#
# 用插件的 Rust 侧 API（`app.opener().open_url`）而非前端 JS API：这样 webview 对
# opener 命令的 ACL 保持**默认拒绝**（capabilities 里不加任何 `opener:*` 权限），
# 唯一入口是本仓自己的 `open_external_url` command——scheme 白名单、诊断埋点、
# 错误信封都在那一处，webview 里没有任何第二条能绕开校验去开 URL 的路径。
# 同类取舍先例见上面 rfd 一行。
tauri-plugin-opener = "2"
# 移到废纸篓（M244，change file-tree-context-menu）：删除必须可恢复（裁决点 2），
# 平台语义由 crate 持有——macOS 走 NSFileManager 的 trashItem，目录整棵入篓、可整体放回，
# 不自己拼 `osascript`/`mv` 命令。
#
# 为什么是 trash：纯用户态调用（无外部进程、无路径 quoting 注入面），错误类型区分
# 「目标不可访问 / 路径无法规范化 / 卷不支持废纸篓」几类，正好是错误信封要的人话来源；
# 被否决的替代是 osascript 驱动 Finder（外部进程 + 注入面，design §4.6）与
# `std::fs::remove_file`（永久删除，产品裁决明确不提供）。
trash = "5"
# 忽略规则匹配器（change vault-open-ignore-set §4.8）：**只用它的 `gitignore` 模块**
#（`ignore::gitignore`，ripgrep 同源的 gitignore 语义实现），不换掉本仓自己的遍历实现。
#
# 为什么是它：本 change 的产品语义是「按用户写的规则办事」（vault 自己的 `.gitignore` /
# `.git/info/exclude` 决定哪些子树被主动枚举），规则解释错了就等于产品承诺没兑现——`!` 取反
# 与排除目录的交互、`/` 锚定边界、`**` 语义、注释与转义、目录限定（尾斜杠）这几处的子集实现
# 必然猜错，猜错的后果是「该隐藏的没隐藏」（性能回落）或「该显示的没显示」（正是 Alex 那条
# 「忽略项在左栏仍然可见」的约束要防的）。
#
# 合并之后它同时承载三件事：**`hidden` 档**（`config::DEFAULT_HIDDEN` 的两个名字 + 两条恒定
# 临时文件模式）、**`lazy` 档**（`config::DEFAULT_LAZY` 的 14 个名字）与**用户规则**——三档共用
# 同一类匹配器（`GitignoreBuilder::add_line` 逐条编入），判定链只有一条：hidden 先判且命中即
# 定格 → lazy 次判且命中即定格 → 用户规则最深匹配决定 → 其余可见。不再有「名字等值」与
# 「规则匹配」两套实现（`is_ignored` 随之退役）；两档名字可在 `config.json` 的 `[vault]` 表里改。
#
# 代价：连带 globset / bstr / crossbeam-* 等传递依赖（见 Cargo.lock 的 5 个新增 `[[package]]`）。
# 被否决的替代是手写 gitignore 子集（零新增依赖，但子集必然猜错，见上）。
ignore = "0.4"
# 对话运行时（change add-harness-probe §3，M302）：Rust 侧首笔网络依赖。
# reqwest blocking + rustls（不用 native-tls，避免引入系统 OpenSSL 链路）：SSE 响应按行读取
# （blocking Response 实现 Read），逐事件解析后经 app.emit 推面板；刻意不引 tokio——
# 单个顺序 SSE 流没有 async 组合需求，与 lib.rs:410 的既有判断同路。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

# 通知点击回调的后端选择（M608）：macOS 26 上 legacy NSUserNotificationCenter（mac-notification-sys
# 0.6.15）的 `didActivateNotification` 到不了 app——横幅投递与点击系统侧都确认，进程内零回调，
# 点击链路整条失效（探针证据：`.local/probes/m608-cron-notification-click/`）。
#
# notify-rust 4.18.0 起提供 UNUserNotificationCenter 后端，由 `preview-macos-un` feature 选择；
# tauri-plugin-notification 2.6.0 自己不启用它，而 Cargo 特性是可加的——这里用**同版本**直接依赖
# 并开该 feature，统一后插件那份 notify-rust 也切到 UN 后端，插件的 `on_action` / `wait_for_response`
# 对外语义不变（`install_notification_click` 不用改）。版本必须与插件的 `notify-rust = "4.18"`
# 解析到同一份，所以钉死 4.18.2（当前锁文件值）。
#
# 代价：多出 mac-usernotifications / objc2-user-notifications 两个传递依赖；UN 要求 app 有 bundle
# 与代码签名（打包实例是 ad-hoc 签名，够用），且授权状态要单独请求（见 lib.rs
# `ensure_notification_permission` 的 macOS 分支）。
[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "=4.18.2", features = ["preview-macos-un"] }

[features]
# 生产构建开关（Tauri 2 官方模板约定，名称必须恰为 custom-protocol）：
# tauri build 会自动带上 --features custom-protocol，此时 tauri::is_dev() == false，
# webview 加载内嵌的 frontendDist；不带该 feature 的构建（含裸 cargo build）一律视为
# dev，加载 tauri.conf.json 的 devUrl——vite dev server 不在时窗口就是白屏（空文档，
# 控制台报 "Could not connect to the server http://127.0.0.1:1420/"），不弹任何错误。
# 裸 debug 二进制直连 dist 的验证方式：cargo build --features custom-protocol。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
lto = true
opt-level = 3
