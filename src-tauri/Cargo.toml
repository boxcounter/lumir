[package]
name = "lumir"
version = "0.4.0"
edition = "2021"
description = "Lumir — skeleton shell (M0 harness)"
license = "MIT"

[lib]
name = "lumir_lib"
# 只要 rlib：staticlib/cdylib 是 Tauri mobile 模板残留，移动端是 ADR 0001 非目标；
# 多 crate-type 会让每次构建（含 perf CI 的 release 构建）白付链接时间。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# payload 类型单一来源选型：ts-rs（而非 specta / tauri-specta）。
# 理由：单 crate、无运行时开销、bindings 由 cargo test 顺带导出（契合 rust.yml 门禁）；
# specta 方案需同时引入 specta + tauri-specta 且强绑定其 builder，本阶段契约只是薄约定，
# 只需要"类型一处定义、TS 自动生成"，不需要它生成的 invoke wrapper。取舍详见 commands.rs 模块文档。
ts-rs = "11"
sha2 = "0.10"
# vault watch（add-vault-workspace）：notify 8 稳定线（9.x 仍是 rc）。
notify = "8"
# 目录选择器：rfd 纯 Rust 原生 dialog，不需要 tauri-plugin-dialog 的
# tauri.conf.json / capabilities 配置（那不在本 change 的改动面内）。
rfd = "0.17"
# 外链打开（M144）：交给系统默认应用（macOS 走 NSWorkspace 等价路径），跨平台语义
# 由插件持有，不自己拼 `open` 命令。
#
# 用插件的 Rust 侧 API（`app.opener().open_url`）而非前端 JS API：这样 webview 对
# opener 命令的 ACL 保持**默认拒绝**（capabilities 里不加任何 `opener:*` 权限），
# 唯一入口是本仓自己的 `open_external_url` command——scheme 白名单、诊断埋点、
# 错误信封都在那一处，webview 里没有任何第二条能绕开校验去开 URL 的路径。
# 同类取舍先例见上面 rfd 一行。
tauri-plugin-opener = "2"
# 移到废纸篓（M244，change file-tree-context-menu）：删除必须可恢复（裁决点 2），
# 平台语义由 crate 持有——macOS 走 NSFileManager 的 trashItem，目录整棵入篓、可整体放回，
# 不自己拼 `osascript`/`mv` 命令。
#
# 为什么是 trash：纯用户态调用（无外部进程、无路径 quoting 注入面），错误类型区分
# 「目标不可访问 / 路径无法规范化 / 卷不支持废纸篓」几类，正好是错误信封要的人话来源；
# 被否决的替代是 osascript 驱动 Finder（外部进程 + 注入面，design §4.6）与
# `std::fs::remove_file`（永久删除，产品裁决明确不提供）。
trash = "5"
# 忽略规则匹配器（change vault-open-ignore-set §4.8）：**只用它的 `gitignore` 模块**
#（`ignore::gitignore`，ripgrep 同源的 gitignore 语义实现），不换掉本仓自己的遍历实现。
#
# 为什么是它：本 change 的产品语义是「按用户写的规则办事」（vault 自己的 `.gitignore` /
# `.git/info/exclude` 决定哪些子树被主动枚举），规则解释错了就等于产品承诺没兑现——`!` 取反
# 与排除目录的交互、`/` 锚定边界、`**` 语义、注释与转义、目录限定（尾斜杠）这几处的子集实现
# 必然猜错，猜错的后果是「该隐藏的没隐藏」（性能回落）或「该显示的没显示」（正是 Alex 那条
# 「忽略项在左栏仍然可见」的约束要防的）。
#
# 合并之后它同时承载两件事：**内置规则**（`fs_io::BUILTIN_NAMES` 的 16 个名字字面量 + 两条
# 临时文件模式，用 `GitignoreBuilder::add_line` 编进去）与**用户规则**——两类共用同一类匹配器，
# 判定链只有一条（内置先判且命中即定格 → 用户规则最深匹配决定 → 其余可见），不再有「名字等值」
# 与「规则匹配」两套实现（`is_ignored` 随之退役）。
#
# 代价：连带 globset / bstr / crossbeam-* 等传递依赖（见 Cargo.lock 的 5 个新增 `[[package]]`）。
# 被否决的替代是手写 gitignore 子集（零新增依赖，但子集必然猜错，见上）。
ignore = "0.4"
# 对话运行时（change add-harness-probe §3，M302）：Rust 侧首笔网络依赖。
# reqwest blocking + rustls（不用 native-tls，避免引入系统 OpenSSL 链路）：SSE 响应按行读取
# （blocking Response 实现 Read），逐事件解析后经 app.emit 推面板；刻意不引 tokio——
# 单个顺序 SSE 流没有 async 组合需求，与 lib.rs:410 的既有判断同路。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[features]
# 生产构建开关（Tauri 2 官方模板约定，名称必须恰为 custom-protocol）：
# tauri build 会自动带上 --features custom-protocol，此时 tauri::is_dev() == false，
# webview 加载内嵌的 frontendDist；不带该 feature 的构建（含裸 cargo build）一律视为
# dev，加载 tauri.conf.json 的 devUrl——vite dev server 不在时窗口就是白屏（空文档，
# 控制台报 "Could not connect to the server http://127.0.0.1:1420/"），不弹任何错误。
# 裸 debug 二进制直连 dist 的验证方式：cargo build --features custom-protocol。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
lto = true
opt-level = 3
