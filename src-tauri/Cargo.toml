[package]
name = "lumir"
version = "0.11.1"
edition = "2021"
description = "Lumir — skeleton shell (M0 harness)"
license = "MIT"

[lib]
name = "lumir_lib"
# 只要 rlib：staticlib/cdylib 是 Tauri mobile 模板残留，移动端是 ADR 0001 非目标；
# 多 crate-type 会让每次构建（含 perf CI 的 release 构建）白付链接时间。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 第三方库的诊断通道（M637）：本仓自己的埋点走 `logging` 模块的显式 API，从不打 `log`；
# 但依赖树里的 `mac-usernotifications` 等库在失败时用 `log::error!` 报告原因（含 NSError 的
# localizedDescription），没有后端就全被丢弃。`log` 本就在依赖树里（transitive），提升为直接
# 依赖零新增编译重量；`logging::init` 装一条 warn / error → JSONL 的桥。
log = "0.4"
# session id 的随机段（rand 已在依赖树内 transitive 存在，直接引用零新增编译重量）。
rand = "0.10"
# 本地时间换算（change add-cron-runtime-daemon，design §4.3）：定时任务的「今天」与「到点」
# 都按**本机本地时间**判定，`chrono::Local` 是 std 之外唯一可用的偏移来源。锁文件里已有
# chrono 0.4（transitive），本项只是把它提升为直接依赖，零新增编译重量。
# `default-features = false`：默认档带 wasm 绑定（wasmbind → wasm-bindgen / js-sys），本仓
# 不编 wasm；只开 clock（`Local` 的时区来源）与 std。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# payload 类型单一来源选型：ts-rs（而非 specta / tauri-specta）。
# 理由：单 crate、无运行时开销、bindings 由 cargo test 顺带导出（契合 rust.yml 门禁）；
# specta 方案需同时引入 specta + tauri-specta 且强绑定其 builder，本阶段契约只是薄约定，
# 只需要"类型一处定义、TS 自动生成"，不需要它生成的 invoke wrapper。取舍详见 commands.rs 模块文档。
ts-rs = "11"
sha2 = "0.10"
# 子代理定义文件的 frontmatter 解析（change add-harness-subagents tasks §2.1）：只解析标量 +
# 字符串列表 + 注释子集，产出窄结构体，不走宽松反序列化。
#
# **为什么是 saphyr 而不是 yaml-rust2**：`serde_yaml` 已 deprecated（0.9.34+deprecated，2024-03
# 后无更新）。yaml-rust2 0.13 的 README 自述「只做基础维护、保留稳定 API」，新特性归 saphyr
# （同作者、同仓库谱系的继任者，0.2.x）；本仓只在定义文件这一处消费 YAML，API 稳定性不是取舍点，
# 维护方向才是——选继任者，避免下一次 YAML 修复落不到已冻结的 API 上。两者的解析质量同源
# （同一份 YAML 1.2 实现谱系），saphyr 多出的传递依赖（saphyr-parser / ordered-float / thiserror）
# 都是小 crate，编译重量可忽略。
#
# `default-features = false`：默认档带 `encoding`（encoding_rs）——定义文件是 UTF-8，本仓不读
# 别的编码，关掉避免白付依赖。
saphyr = { version = "0.2", default-features = false }
# 剪贴板图片转码（change paste-clipboard-image，design §4）：png 解码 + **无损 WebP** 编码。
# 用 `default-features = false` 只开需要的两个格式 feature——默认格式集含 avif（ravif）、tiff 等
# 本 change 用不到的重依赖，开着会白付编译与二进制体积。两条链路都是纯 Rust（`image-webp` +
# `png`），零 C 依赖、零外部进程，不引入构建面。
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
# SVG 引用的栅格化（change svg-image-quote-oct24；方向裁决：Alex 2026-10-24「好，采纳 A」）：
# 预览层认 svg，而三家 provider（Kimi / DeepSeek / OpenAI）的图片输入都不收 SVG，写入口又只收
# 位图——svg 引用因此必然走「枚举成功、落盘拒绝」的半成功路径（survey 报告
# .local/reports/quote-image-pipeline-oct24.md §4.3 / §4.4）。resvg 把 SVG 渲成位图，再走既有
# png→WebP 链路：落盘名仍是 `pasted-<hash16>.webp`，缩略图 / 投递 / 恢复零改动。
#
# **为什么 default-features = false**：默认档带 svgz（flate2 解压）、memmap-fonts（memmap2）与
# raster-images（gif / image-webp / zune-jpeg 三个解码器）。本仓只需要 `<text>` 的字体（fontdb
# 装系统字体：`text` + `system-fonts`）、纯矢量渲染与**内嵌位图**（`raster-images`）。关掉的两项
# 是：gzip 过的 svg 不在图片注册表里（`.svgz` 不是图片扩展名）；内存映射字体是纯加载优化
# （字体一次性装进内存，几十毫秒，不是瓶颈）。
#
# **为什么 raster-images 必须开着**：resvg 在缺这个 feature 时会把 `<image>` 的**全部位图**丢弃
# （`render_inner` 的 `not(raster-images)` 分支只打一条 warn）——包括 `data:` URI 里的内嵌 PNG。
# 那会让「SVG 里内嵌一张图」悄悄少一块，且没有任何人侧提示。`data:` 是**内联载荷**：零 I/O、
# 零外部引用，与本 change 要关的「外部资源加载」是两件事（后者关在 `svg_raster` 的
# `resolve_string` 上）。代价是 `gif` + `zune-jpeg` 两个解码器进依赖树（`image-webp` 已在
# `image` 的 webp feature 里）。
#
# 安全边界落在 `src-tauri/src/svg_raster.rs`：外部 href 恒拒（不读 file: / http(s) / 相对路径）、
# viewBox→位图最长边夹 4096、产物只出位图（MUST NOT 原样存 SVG）。
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "raster-images"] }
# 系统通知（change add-cron-runtime-daemon §4）：cron 的「到点 / 已完成 / 运行失败」投递与
# 点击唤起。**macOS 打包实例自 change add-cron-notification-relaunch 起由本仓自持**
# （`src-tauri/src/notify/`）：delegate 必须在应用完成启动之前装、并持有强引用到进程退出，
# 而依赖库把 delegate 与响应映射都藏在 `pub(crate)` 里且懒装——「应用退出期间投递的通知被点击」
# 在它那里没有接收方。因此这里的 notify-rust **只承担 Linux / Windows**：
# 投递点是 `lumir-cron` 线程、点击等待在进程侧，都是 Rust 侧调用而不经 webview——capabilities
# 因此零增量（与 opener / rfd 同一取舍先例）。
#
# **为什么直连而不是通知插件**（M620 / M625）：插件的投递把结果吞成恒 Ok（`show()` 无条件
# 返回 Ok，底层错误被丢弃），「投递成功」是假的——`cron_notified` 与 `last_fired` 照写，提醒
# 却可能没发出去。直连后错误能真实上抛（design §5.4「投递失败不写 last_fired，下一次评估重试」
# 因此才成立）；点击等待由本仓按每条通知登记，非 macOS 平台同一条路径。
notify-rust = { version = "=4.18.2" }
# vault watch（add-vault-workspace）：notify 8 稳定线（9.x 仍是 rc）。
notify = "8"
# 目录选择器：rfd 纯 Rust 原生 dialog，不需要 tauri-plugin-dialog 的
# tauri.conf.json / capabilities 配置（那不在本 change 的改动面内）。
rfd = "0.17"
# 外链打开（M144）：交给系统默认应用（macOS 走 NSWorkspace 等价路径），跨平台语义
# 由插件持有，不自己拼 `open` 命令。
#
# 用插件的 Rust 侧 API（`app.opener().open_url`）而非前端 JS API：这样 webview 对
# opener 命令的 ACL 保持**默认拒绝**（capabilities 里不加任何 `opener:*` 权限），
# 唯一入口是本仓自己的 `open_external_url` command——scheme 白名单、诊断埋点、
# 错误信封都在那一处，webview 里没有任何第二条能绕开校验去开 URL 的路径。
# 同类取舍先例见上面 rfd 一行。
tauri-plugin-opener = "2"
# 移到废纸篓（M244，change file-tree-context-menu）：删除必须可恢复（裁决点 2），
# 平台语义由 crate 持有——macOS 走 NSFileManager 的 trashItem，目录整棵入篓、可整体放回，
# 不自己拼 `osascript`/`mv` 命令。
#
# 为什么是 trash：纯用户态调用（无外部进程、无路径 quoting 注入面），错误类型区分
# 「目标不可访问 / 路径无法规范化 / 卷不支持废纸篓」几类，正好是错误信封要的人话来源；
# 被否决的替代是 osascript 驱动 Finder（外部进程 + 注入面，design §4.6）与
# `std::fs::remove_file`（永久删除，产品裁决明确不提供）。
trash = "5"
# 忽略规则匹配器（change vault-open-ignore-set §4.8）：**只用它的 `gitignore` 模块**
#（`ignore::gitignore`，ripgrep 同源的 gitignore 语义实现），不换掉本仓自己的遍历实现。
#
# 为什么是它：本 change 的产品语义是「按用户写的规则办事」（vault 自己的 `.gitignore` /
# `.git/info/exclude` 决定哪些子树被主动枚举），规则解释错了就等于产品承诺没兑现——`!` 取反
# 与排除目录的交互、`/` 锚定边界、`**` 语义、注释与转义、目录限定（尾斜杠）这几处的子集实现
# 必然猜错，猜错的后果是「该隐藏的没隐藏」（性能回落）或「该显示的没显示」（正是 Alex 那条
# 「忽略项在左栏仍然可见」的约束要防的）。
#
# 合并之后它同时承载三件事：**`hidden` 档**（`config::DEFAULT_HIDDEN` 的两个名字 + 两条恒定
# 临时文件模式）、**`lazy` 档**（`config::DEFAULT_LAZY` 的 14 个名字）与**用户规则**——三档共用
# 同一类匹配器（`GitignoreBuilder::add_line` 逐条编入），判定链只有一条：hidden 先判且命中即
# 定格 → lazy 次判且命中即定格 → 用户规则最深匹配决定 → 其余可见。不再有「名字等值」与
# 「规则匹配」两套实现（`is_ignored` 随之退役）；两档名字可在 `config.json` 的 `[vault]` 表里改。
#
# 代价：连带 globset / bstr / crossbeam-* 等传递依赖（见 Cargo.lock 的 5 个新增 `[[package]]`）。
# 被否决的替代是手写 gitignore 子集（零新增依赖，但子集必然猜错，见上）。
ignore = "0.4"
# 对话运行时（change add-harness-probe §3，M302）：Rust 侧首笔网络依赖。
# reqwest blocking + rustls（不用 native-tls，避免引入系统 OpenSSL 链路）：SSE 响应按行读取
# （blocking Response 实现 Read），逐事件解析后经 app.emit 推面板；刻意不引 tokio——
# 单个顺序 SSE 流没有 async 组合需求，与 lib.rs:410 的既有判断同路。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 打包实例的通知平台层（change add-cron-notification-relaunch §2 方案 A）：delegate 安装与
# 保活、投递、投递后自查、授权查询 / 申请全部由 `src-tauri/src/notify/macos.rs` 自持。
#
# 四个都是**已在锁文件里**的 crate（objc2 / objc2-foundation / block2 经 tauri，
# objc2-user-notifications 经 tauri 的 objc2-ui-kit 链），升为直接依赖零新增版本、零新增编译
# 重量；同时删掉 `mac-usernotifications 0.3.1`（自持后 macOS 上不再有调用点，留着就是假开关，
# AGENTS.md「变更默认直接切断」）。
#
# feature 集按本仓**实际用到的类**开（objc2-foundation 默认档之外按类名挑，避免把无关框架面
# 编进来）：`NSBundle`（bundle 身份检查）、`NSString` / `NSArray`（投递与自查的参数）、
# `NSError`（失败原因）、`NSSet` / `NSDictionary` / `NSDate` / `NSValue` / `NSCalendar` / `NSSet`
# 是 `objc2-user-notifications` 的 feature 声明要求拉进来的依赖类。
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSArray",
    "NSError",
    "NSBundle",
    "NSDictionary",
    "NSDate",
    "NSValue",
    "NSSet",
    "NSCalendar",
    "NSObject",
] }
objc2-user-notifications = "0.3"
block2 = "0.6"
# dev flavour 的 legacy 投递（M608）：UN 在无 bundle 进程里 abort，dev 用它保持「能投递」。
# 打包实例已不再经过它（自持的 UN 实现只服务打包实例），它只服务 dev flavour。
mac-notification-sys = "=0.6.15"

[features]
# 生产构建开关（Tauri 2 官方模板约定，名称必须恰为 custom-protocol）：
# tauri build 会带上 `--features tauri/custom-protocol`（依赖自身的 feature），此时
# tauri::is_dev() == false，webview 加载内嵌的 frontendDist；不带该 feature 的构建（含裸
# cargo build）一律视为 dev，加载 tauri.conf.json 的 devUrl——vite dev server 不在时窗口就是
# 白屏（空文档，控制台报 "Could not connect to the server http://127.0.0.1:1420/"），不弹任何错误。
# 裸 debug 二进制直连 dist 的验证方式：cargo build --features custom-protocol。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
lto = true
opt-level = 3
