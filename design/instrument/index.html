<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumir · Instrument 走查台</title>
<style>
/* ============================================================================
   精密仪器 Instrument —— 工具工艺即美。
   token 层：Geist 功能态三级（背景/边框各分 default/hover/active）+ 动效时长
   token（120/150/220ms）+ 强调色预算两枚（主强调 + agent 语义色）。
   eink：纯黑纯白禁灰阶、无阴影无透明无动画；弱化=斜体，状态=字重/边框/图案。
   ============================================================================ */
[data-theme="light"] {
  --bg:#ffffff;            /* 正文面：纯白工作台 */
  --bg-nav:#f4f5f6;        /* 导航退两色阶（Linear：不抢未赢得的注意力） */
  --bg-1:#ffffff; --bg-2:#eff1f3; --bg-3:#e4e7ea;   /* 功能态 default/hover/active */
  --bd-1:#e3e5e8; --bd-2:#d1d5da; --bd-3:#b8bec6;   /* 边框 default/hover/active */
  --text:#1e222a; --dim:#697079; --faint:#9aa1aa;
  --accent:#3b5bdb; --accent-ink:#ffffff; --agent:#0c9488; --danger:#cf4444;
  --agent-tint:rgba(12,148,136,.09); --accent-tint:rgba(59,91,219,.07);
  --sel-tint:rgba(59,91,219,.14);
  --shadow-1:0 1px 2px rgba(20,22,26,.05),0 10px 28px rgba(20,22,26,.12);
  --pattern-stripes:none; --pattern-double:none;
  --radius:6px;
}
[data-theme="dark"] {
  --bg:#1a1c20;            /* 石墨：中性深灰而非纯黑，工具的原生 habitat */
  --bg-nav:#131518;
  --bg-1:#1a1c20; --bg-2:#22252b; --bg-3:#2b3038;
  --bd-1:#2b3038; --bd-2:#3b414b; --bd-3:#4f5662;
  --text:#d6d9de; --dim:#8d939d; --faint:#60666f;
  --accent:#7c9bff; --accent-ink:#10131a; --agent:#4cc2ae; --danger:#e07a7a;
  --agent-tint:rgba(76,194,174,.13); --accent-tint:rgba(124,155,255,.12);
  --sel-tint:rgba(124,155,255,.22);
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45);
  --pattern-stripes:none; --pattern-double:none;
  --radius:6px;
}
[data-theme="eink"] {
  --bg:#ffffff; --bg-nav:#ffffff;
  --bg-1:#ffffff; --bg-2:#ffffff; --bg-3:#ffffff;
  --bd-1:#000000; --bd-2:#000000; --bd-3:#000000;
  --text:#000000; --dim:#000000; --faint:#000000;   /* 禁灰阶：弱化只能走斜体/字重/图案 */
  --accent:#000000; --accent-ink:#ffffff; --agent:#000000; --danger:#000000;
  --agent-tint:transparent; --accent-tint:transparent; --sel-tint:transparent;
  --shadow-1:none;
  --pattern-stripes:repeating-linear-gradient(135deg,#000 0 1px,#fff 1px 6px);
  --pattern-double:3px double #000;
  --radius:0;
}
[data-theme="eink"] *, [data-theme="eink"] *::before, [data-theme="eink"] *::after {
  box-shadow:none !important; text-shadow:none !important;
  transition:none !important; animation:none !important;
  backdrop-filter:none !important; background-image:none;
}
/* eink 斜纹只在显式声明的元素上恢复（上一条规则清了 background-image） */
[data-theme="eink"] .stripes { background-image:var(--pattern-stripes) !important; }
[data-theme="eink"] .dim, [data-theme="eink"] .c-label { font-style:italic; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition:none !important; animation:none !important; }
}

* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body {
  font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg); color:var(--text); font-size:13px;
  -webkit-font-smoothing:antialiased;
}
button { font:inherit; color:inherit; }
button, input, .seg button, .ft-row, .nav-row {
  transition:background-color 150ms cubic-bezier(.2,.8,.2,1),
             border-color 150ms cubic-bezier(.2,.8,.2,1),
             color 150ms cubic-bezier(.2,.8,.2,1),
             opacity 150ms cubic-bezier(.2,.8,.2,1);
}
:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
[data-theme="eink"] :focus-visible { outline:3px double #000; }

/* macOS 原生 tracking 曲线：字距随字号变化，不写死统一 letter-spacing。
   11px 大写铭牌 +0.08em；13px UI 0；15px 正文 0；标题 -0.01em。 */
.micro {
  font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  color:var(--dim);
}
[data-theme="eink"] .micro { font-style:italic; letter-spacing:.12em; }
.mono { font-family:ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums; }
kbd {
  font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:10.5px;
  border:1px solid var(--bd-2); border-bottom-width:2px; border-radius:4px;
  padding:0 4px; background:var(--bg-1); color:var(--dim); white-space:nowrap;
}
[data-theme="eink"] kbd { border-bottom-width:1px; }

/* ============ 走查台（demo 元界面，非产品 UI） ============ */
#console {
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px;
  padding:7px 14px; border-bottom:1px solid var(--bd-1);
  background:var(--bg-nav); font-size:12px; min-height:40px;
}
#console .c-title { font-weight:650; margin-right:2px; }
.c-group { display:flex; align-items:center; gap:6px; }
.c-label { color:var(--dim); }
.seg { display:inline-flex; border:1px solid var(--bd-1); border-radius:var(--radius); overflow:hidden; background:var(--bg-1); }
.seg button {
  border:none; background:none; padding:3px 9px; cursor:pointer;
  border-right:1px solid var(--bd-1);
}
.seg button:last-child { border-right:none; }
.seg button:hover:not(.active):not(:disabled) { background:var(--bg-2); }
.seg button.active { background:var(--bg-3); font-weight:600; box-shadow:inset 0 0 0 1px var(--bd-3); }
[data-theme="eink"] .seg button.active { box-shadow:none; outline:3px double #000; outline-offset:-3px; }
.c-note { color:var(--dim); flex-basis:100%; line-height:1.5; }
[data-theme="eink"] .c-note { font-style:italic; }
.c-measure { min-width:140px; accent-color:var(--accent); }
.c-measure-val { min-width:64px; }
#intent-block {
  flex-basis:100%; border-left:3px solid var(--accent); padding:6px 10px;
  line-height:1.6; max-width:980px;
}
[data-theme="eink"] #intent-block { border-left:var(--pattern-double); }
#intent-block b { color:var(--accent); }

#stage { height:100%; display:flex; flex-direction:column; }
#app { flex:1; min-height:0; display:flex; flex-direction:column; position:relative; }
#app.gray { filter:grayscale(1); }

/* ============ 工具栏（macOS toolbar：图标无 bezel、三段分组） ============ */
#toolbar {
  display:flex; align-items:center; gap:4px; height:40px; padding:0 10px;
  border-bottom:1px solid var(--bd-1); background:var(--bg); flex:none;
}
.tb-btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:none; background:none; border-radius:var(--radius); cursor:pointer;
  height:28px; min-width:28px; padding:0 6px; color:var(--dim);
}
.tb-btn:hover { background:var(--bg-2); color:var(--text); }
.tb-btn:active { background:var(--bg-3); }
.tb-btn svg { width:16px; height:16px; display:block; }
.tb-btn.on { color:var(--accent); }
[data-theme="eink"] .tb-btn.on { font-weight:700; color:#000; }
.tb-title {
  flex:1; min-width:0; text-align:center; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; font-weight:600; font-size:13px; letter-spacing:0;
}
.tb-title .sub { color:var(--dim); font-weight:400; }
#tb-delegate {
  border:1px solid var(--bd-2); border-radius:var(--radius); background:var(--bg-1);
  height:26px; padding:0 10px; cursor:pointer; font-size:12px;
  display:none; align-items:center; gap:6px;
}
#tb-delegate:hover { background:var(--bg-2); border-color:var(--bd-3); }
#tb-delegate.show { display:inline-flex; }
#tb-delegate .n { font-family:ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums; color:var(--accent); font-weight:600; }

/* ============ 主区三栏：导航 | 正文 | Context Surface（默认隐藏） ============ */
#main { flex:1; min-height:0; display:flex; }
#nav {
  width:248px; flex:none; background:var(--bg-nav); border-right:1px solid var(--bd-1);
  overflow:auto; transition:width 220ms cubic-bezier(.2,.8,.2,1), padding 220ms cubic-bezier(.2,.8,.2,1);
  padding:10px 8px;
}
#nav.closed { width:0; padding:10px 0; border-right-color:transparent; overflow:hidden; }
#nav .nav-inner { min-width:232px; }
.nav-sec { margin:14px 2px 6px; display:flex; align-items:baseline; justify-content:space-between; }
.nav-sec:first-child { margin-top:2px; }

/* Thread 卡：意图空间的一等对象（ADR 0005 §2） */
.thread-card {
  border:1px solid var(--bd-1); border-radius:var(--radius); background:var(--bg-1);
  padding:8px 10px; cursor:pointer;
}
.thread-card:hover { background:var(--bg-2); border-color:var(--bd-2); }
.thread-title { font-weight:600; line-height:1.45; }
.thread-meta {
  margin-top:4px; display:flex; align-items:center; gap:6px;
  color:var(--dim); font-size:11.5px;
}
.thread-meta .mono { font-size:11px; }
.status-dot { width:6px; height:6px; border-radius:50%; background:var(--agent); flex:none; }
[data-theme="eink"] .status-dot { border-radius:0; outline:1px solid #000; background:#fff; }

/* 阅读集合：文件角色只属于当前 Thread */
.nav-row {
  display:flex; align-items:center; gap:7px; width:100%; padding:4px 7px;
  border:1px solid transparent; background:none; text-align:left; cursor:pointer;
  border-radius:var(--radius);
}
.nav-row:hover { background:var(--bg-2); border-color:var(--bd-2); }
.nav-row.active { background:var(--bg-3); border-color:var(--bd-3); box-shadow:inset 2px 0 0 var(--accent); font-weight:600; }
[data-theme="eink"] .nav-row.active { box-shadow:none; outline:var(--pattern-double); outline-offset:-3px; }
.nav-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
.nav-meta { flex:none; color:var(--faint); font-size:11px; }
.role-chip {
  flex:none; font-size:10.5px; color:var(--dim); border:1px solid var(--bd-1);
  border-radius:3px; padding:0 4px; line-height:1.6;
}
[data-theme="eink"] .role-chip { font-style:italic; }
.ft-dir-label { display:flex; align-items:center; gap:5px; padding:4px 7px; color:var(--dim); cursor:pointer; background:none; border:none; width:100%; text-align:left; border-radius:var(--radius); }
.ft-dir-label:hover { background:var(--bg-2); color:var(--text); }
.ft-caret { width:12px; flex:none; color:var(--faint); font-size:9px; text-align:center; }
.ft-children { margin-left:12px; border-left:1px solid var(--bd-1); padding-left:4px; }
[data-theme="eink"] .ft-children { border-left:1px dashed #000; }
.nav-empty { padding:16px 6px; color:var(--dim); line-height:1.7; }
.nav-open-btn {
  margin-top:10px; padding:6px 14px; border:1px solid var(--bd-2); border-radius:var(--radius);
  background:var(--bg-1); cursor:pointer;
}
.nav-open-btn:hover { background:var(--bg-2); border-color:var(--bd-3); }

/* ============ 正文：排印层 ============ */
#editor { flex:1; min-width:0; position:relative; overflow:auto; background:var(--bg); }
.doc {
  max-width:var(--measure,480px); margin:0 auto; padding:56px 32px 96px;
  font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  font-size:15px; line-height:1.75; letter-spacing:0;
  hanging-punctuation:first allow-end last;   /* 渐进增强：不支持则静默忽略 */
  text-autospace:auto;                         /* 中西混排自动间距（CLReq ≤1/4 字宽）；不支持则静默忽略 */
}
/* 标题展示面：仅 h1 用衬线（作品铭牌），论证见 RATIONALE */
.doc h1 {
  font-family:"Songti SC","STSong","Noto Serif SC",serif;
  font-size:1.72em; font-weight:700; line-height:1.4; letter-spacing:-0.01em;
  margin:0 0 1.2em;
}
.doc h2 {
  font-size:1.06em; font-weight:650; letter-spacing:-0.01em;
  margin:2.6em 0 .9em; padding-top:.9em; border-top:1px solid var(--bd-1);
}
.doc p { margin:.6em 0; }
.doc ::selection { background:var(--sel-tint); }
[data-theme="eink"] .doc ::selection { background:#000; color:#fff; }

/* 编辑点锚点：light 级——余光可及，不打扰阅读流 */
.ep {
  border-bottom:1px dotted var(--agent); cursor:pointer;
  transition:background-color 150ms cubic-bezier(.2,.8,.2,1);
}
.ep::after {
  content:""; display:inline-block; width:4px; height:4px; border-radius:50%;
  background:var(--agent); margin-left:3px; vertical-align:super;
}
.ep:hover { background:var(--agent-tint); }
[data-theme="eink"] .ep { border-bottom:3px double #000; font-weight:600; }
[data-theme="eink"] .ep::after { width:5px; height:5px; border-radius:0; background:#fff; outline:1px solid #000; }
.ep.processing { border-bottom-style:solid; }
.ep.processing::after { animation:ep-pulse 1.1s ease-in-out infinite; }
[data-theme="eink"] .ep.processing::after { background-image:var(--pattern-stripes) !important; outline:1px solid #000; }
@keyframes ep-pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }
.ep.review { border-bottom:2px solid var(--agent); background:var(--agent-tint); }
[data-theme="eink"] .ep.review { border-bottom:3px double #000; }
[data-theme="eink"] .ep.review::after { background:#000; }
.ep.current { box-shadow:0 2px 0 var(--agent); }
[data-theme="eink"] .ep.current { box-shadow:none; outline:var(--pattern-double); outline-offset:1px; }
.ep.archiving { opacity:0; transition:opacity 150ms cubic-bezier(.2,.8,.2,1); }

/* 接受后的新词：高亮渐隐（morph 反馈），eink 无动画直接落定 */
.doc .just-in { animation:just-in 900ms ease-out 1; border-radius:2px; }
@keyframes just-in {
  0% { background:var(--agent-tint); box-shadow:0 0 0 2px var(--agent-tint); }
  100% { background:transparent; box-shadow:none; }
}
/* 跳到正文的原位闪烁 */
.flash-anchor { animation:flash-a 700ms ease-out 2; }
@keyframes flash-a { 0%,100% { background:transparent; } 50% { background:var(--accent-tint); } }
[data-theme="eink"] .flash-anchor { animation:none; font-weight:700; }

/* 空态 */
.editor-empty {
  position:absolute; inset:0; display:flex; flex-direction:column; gap:14px;
  align-items:center; justify-content:center; color:var(--dim); text-align:center;
  padding:24px; line-height:1.7;
}
.editor-empty .nav-open-btn { margin-top:0; }

/* ============ 选中创建浮层（Rauno：轻量动作即时、贴着选区、说完即走） ============ */
#sel-pop {
  position:absolute; z-index:30; width:300px;
  border:1px solid var(--bd-2); border-radius:var(--radius); background:var(--bg-1);
  box-shadow:var(--shadow-1); padding:10px;
  opacity:0; transform:translateY(4px) scale(.98); pointer-events:none;
  transition:opacity 150ms cubic-bezier(.2,.8,.2,1), transform 150ms cubic-bezier(.2,.8,.2,1);
}
#sel-pop.show { opacity:1; transform:none; pointer-events:auto; }
#sel-pop .quote {
  font-size:12px; color:var(--dim); line-height:1.5; margin-bottom:8px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
#sel-pop input {
  width:100%; border:1px solid var(--bd-1); border-radius:var(--radius);
  background:var(--bg); color:var(--text); font:inherit; padding:6px 9px; outline:none;
}
#sel-pop input:focus { border-color:var(--bd-3); }
#sel-pop .chips { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
#sel-pop .chip {
  border:1px solid var(--bd-1); border-radius:10px; background:none; color:var(--dim);
  font-size:11.5px; padding:1px 8px; cursor:pointer;
}
#sel-pop .chip:hover { background:var(--bg-2); color:var(--text); border-color:var(--bd-2); }
#sel-pop .hint { margin-top:8px; display:flex; justify-content:flex-end; gap:8px; color:var(--faint); font-size:11px; align-items:center; }
[data-theme="eink"] #sel-pop { border:2px solid #000; }

/* ============ Context Surface（右栏，默认隐藏，随状态出现） ============ */
#surface {
  width:0; flex:none; overflow:hidden; background:var(--bg-nav);
  border-left:none;
  transition:width 220ms cubic-bezier(.2,.8,.2,1);
}
#surface.open { width:304px; border-left:1px solid var(--bd-1); }
#surface .surf-inner { width:304px; padding:12px; height:100%; overflow:auto; }
.surf-card {
  border:1px solid var(--bd-1); border-radius:var(--radius); background:var(--bg-1);
  animation:surf-in 220ms cubic-bezier(.2,.8,.2,1);
}
@keyframes surf-in { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:none; } }
.surf-head { padding:9px 12px; border-bottom:1px solid var(--bd-1); display:flex; align-items:center; gap:8px; }
.surf-head .micro { flex:1; }
.surf-title { font-weight:650; padding:10px 12px 0; }
.surf-body { padding:8px 12px 12px; font-size:12.5px; line-height:1.65; }
.surf-body p { margin:.45em 0; }
.dim { color:var(--dim); }

/* 委派卡：授权范围是显式声明，授权先于修改大小（ADR 0005 §5） */
.scope-box {
  border:1px solid var(--bd-1); border-radius:var(--radius); background:var(--bg-2);
  padding:8px 10px; margin:8px 0; line-height:1.6;
}
[data-theme="eink"] .scope-box { border:var(--pattern-double); background:#fff; }
.del-list { margin:6px 0; }
.del-item { display:flex; gap:8px; padding:5px 0; border-top:1px solid var(--bd-1); align-items:baseline; }
.del-item:first-child { border-top:none; }
.del-item .idx { flex:none; color:var(--faint); font-size:11px; }
.del-item .q { flex:1; min-width:0; }
.del-item .intent { color:var(--dim); font-size:12px; }
.card-actions { display:flex; gap:8px; margin-top:10px; }
.btn {
  flex:1; padding:5px 10px; border:1px solid var(--bd-2); border-radius:var(--radius);
  background:var(--bg-1); cursor:pointer; display:inline-flex; align-items:center;
  justify-content:center; gap:6px;
}
.btn:hover { background:var(--bg-2); border-color:var(--bd-3); }
.btn:active { background:var(--bg-3); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
[data-theme="eink"] .btn.primary { background:#000; color:#fff; border-color:#000; }
.btn.danger { color:var(--danger); }
[data-theme="eink"] .btn.danger { font-weight:700; }

/* 工作中进度：逐步状态，不用 spinner 堆叠 */
.prog-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--bd-1); }
.prog-row:first-of-type { border-top:none; }
.prog-mark { width:14px; height:14px; flex:none; display:inline-flex; align-items:center; justify-content:center; }
.prog-mark .dot { width:7px; height:7px; border-radius:50%; }
.prog-mark .dot.queued { border:1px solid var(--bd-3); }
.prog-mark .dot.doing { background:var(--agent); animation:ep-pulse 1.1s ease-in-out infinite; }
.prog-mark .dot.done { background:var(--agent); }
[data-theme="eink"] .prog-mark .dot.doing,
[data-theme="eink"] .prog-mark .dot.done { border-radius:0; }
[data-theme="eink"] .prog-mark .dot.doing { background-image:var(--pattern-stripes) !important; outline:1px solid #000; background-color:#fff; }
[data-theme="eink"] .prog-mark .dot.done { background:#000; }
.prog-row .q { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.prog-row .st { flex:none; color:var(--dim); font-size:11.5px; }

/* 回看卡：header 承载「为什么改」，diff 降为证据，动词仅两个 */
.rev-progress { display:flex; align-items:center; gap:6px; }
.rev-progress .cur { font-weight:700; }
.rev-dl dt { font-weight:600; margin-top:8px; font-size:12px; color:var(--dim); }
.rev-dl dd { margin:2px 0 0; }
.diff-para {
  border:1px solid var(--bd-1); border-radius:var(--radius); background:var(--bg-2);
  padding:8px 10px; margin:8px 0; font-size:13px; line-height:1.75;
}
.diff-para del { color:var(--dim); text-decoration:line-through; text-decoration-color:var(--danger); }
.diff-para ins { color:var(--agent); text-decoration:none; font-weight:600; border-bottom:1.5px solid var(--agent); }
[data-theme="eink"] .diff-para del { font-style:italic; text-decoration-color:#000; }
[data-theme="eink"] .diff-para ins { border-bottom:3px double #000; }
.rev-nav { display:flex; gap:8px; align-items:center; margin-top:10px; }
.rev-nav .spacer { flex:1; }
.icon-btn {
  width:26px; height:26px; border:1px solid var(--bd-2); border-radius:var(--radius);
  background:var(--bg-1); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
}
.icon-btn:hover { background:var(--bg-2); border-color:var(--bd-3); }
.icon-btn:disabled { opacity:.35; cursor:default; }
[data-theme="eink"] .icon-btn:disabled { opacity:1; font-style:italic; }

/* tone 级完成横幅：app 级横条（不进滚动容器），从顶部展开落下，方向传达「来自上面的工作流」 */
#tone-banner {
  flex:none; display:flex; align-items:center; justify-content:center; gap:10px;
  max-height:0; overflow:hidden; padding:0 14px; font-size:12.5px; opacity:0;
  background:var(--bg-1); border-bottom:0 solid var(--bd-1); color:var(--text);
  transition:max-height 220ms cubic-bezier(.2,.8,.2,1), padding 220ms cubic-bezier(.2,.8,.2,1), opacity 220ms, border-width 220ms;
}
#tone-banner.show { max-height:40px; padding:7px 14px; opacity:1; border-bottom-width:1px; }
#tone-banner .status-dot { width:7px; height:7px; }
#tone-banner button { border:none; background:none; color:var(--accent); cursor:pointer; font:inherit; font-weight:600; padding:0; }
[data-theme="eink"] #tone-banner button { text-decoration:underline; color:#000; }

/* popup 级：app 级模态（不进滚动容器），仅文件冲突与破坏性确认（calmtech 谱顶端） */
#popup-layer {
  position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
  background:rgba(20,22,26,.32); padding:24px;
}
#popup-layer.show { display:flex; }
[data-theme="eink"] #popup-layer { background:transparent; }
/* eink 分级谱的图案化：委派/待裁决卡 = 双线框，工作中卡 = 斜纹顶条 */
[data-theme="eink"] .surf-card.delegate, [data-theme="eink"] .surf-card.review { border:var(--pattern-double); }
[data-theme="eink"] .surf-card.working::before {
  content:""; display:block; height:6px;
  background-image:var(--pattern-stripes) !important; border-bottom:1px solid #000;
}
.popup {
  width:min(420px,100%); border:1px solid var(--bd-3); border-radius:var(--radius);
  background:var(--bg-1); box-shadow:var(--shadow-1); padding:16px 18px;
  font-size:13px; line-height:1.7;
  animation:pop-in 150ms cubic-bezier(.2,.8,.2,1);
}
@keyframes pop-in { from { opacity:0; transform:scale(.97); } to { opacity:1; transform:none; } }
.popup-title { font-weight:650; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
.popup-title::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--danger); }
[data-theme="eink"] .popup-title::before { border-radius:0; background:#000; }
[data-theme="eink"] .popup { border:4px solid #000; }

/* toast：app 级右下角（不进滚动容器），自动消隐 */
.lumir-toast {
  position:absolute; bottom:36px; right:16px; z-index:35;
  display:flex; align-items:center; gap:10px; padding:8px 14px;
  border-radius:var(--radius); background:var(--text); color:var(--bg);
  font-size:12.5px; max-width:70%;
  animation:toast-in 150ms cubic-bezier(.2,.8,.2,1);
}
@keyframes toast-in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
[data-theme="eink"] .lumir-toast { border:1px solid #000; }

/* ============ 命令面板（一等交互位） ============ */
#palette-layer {
  position:fixed; inset:0; z-index:60; display:none; justify-content:center;
  background:rgba(20,22,26,.28); padding-top:15vh;
}
#palette-layer.show { display:flex; }
[data-theme="eink"] #palette-layer { background:#fff; }
#palette {
  width:min(520px,92vw); height:fit-content; max-height:60vh; overflow:hidden;
  border:1px solid var(--bd-3); border-radius:8px; background:var(--bg-1);
  box-shadow:var(--shadow-1); display:flex; flex-direction:column;
  animation:pop-in 150ms cubic-bezier(.2,.8,.2,1);
}
[data-theme="eink"] #palette { border:2px solid #000; border-radius:0; }
#palette input {
  border:none; border-bottom:1px solid var(--bd-1); background:none; color:var(--text);
  font:inherit; font-size:14px; padding:12px 14px; outline:none;
}
#pal-list { overflow:auto; padding:6px; }
.pal-item {
  display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:var(--radius);
  cursor:pointer; border:1px solid transparent;
}
.pal-item .lbl { flex:1; min-width:0; }
.pal-item .sub { color:var(--dim); font-size:11.5px; }
.pal-item.active { background:var(--bg-2); border-color:var(--bd-2); }
.pal-item.disabled { opacity:.4; cursor:default; }
[data-theme="eink"] .pal-item.disabled { opacity:1; font-style:italic; }
.pal-empty { padding:14px; color:var(--dim); text-align:center; }

/* ============ 状态栏：仪表读数行 ============ */
#statusbar {
  flex:none; height:28px; display:flex; align-items:center; gap:0;
  border-top:1px solid var(--bd-1); background:var(--bg-nav);
  font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:11px;
  font-variant-numeric:tabular-nums; color:var(--dim); padding:0 12px; overflow:hidden;
}
#statusbar .cell { display:inline-flex; align-items:center; gap:5px; padding:0 10px; border-right:1px solid var(--bd-1); height:100%; white-space:nowrap; }
#statusbar .cell:first-child { padding-left:0; }
#statusbar .cell.last { border-right:none; margin-left:auto; padding-right:0; }
#statusbar .val { color:var(--text); }
[data-theme="eink"] #statusbar .val { font-weight:700; }
#statusbar .status-dot { width:6px; height:6px; }
#statusbar .status-dot.idle { background:var(--faint); }
[data-theme="eink"] #statusbar .status-dot.idle { background:#fff; }

/* ============ 批注模式 ============ */
.anno {
  font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:9.5px; font-weight:700;
  color:var(--accent-ink); background:var(--accent); border-radius:7px;
  padding:0 4px; margin-left:4px; vertical-align:super; cursor:help;
  line-height:1.5; display:inline-block;
}
[data-theme="eink"] .anno { border:1px solid #000; border-radius:0; background:#000; color:#fff; }
</style>
</head>

{

  const m = parseInt(q.get("measure"), 10); if (m >= 480 && m <= 1200) state.measure = m;

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const $ = (id) => document.getElementById(id);

/* 播种各控制台状态：静态快照，供走查与截图 */
function seedState(s) {
  stopWork();
  state.conflict = false; state.points = []; state.reviewIndex = 0; state.accepted = {};
  state.paletteOpen = false;
  state.selInfo = null; state.selText = ""; state.selRect = null; state.surfaceManual = undefined;
  if (s === "empty") { state.view = "empty"; state.flow = "reading"; return; }
  state.view = s === "long" ? "long" : "full";
  state.flow = "reading";
  if (["points", "delegate", "working", "review", "conflict", "archived"].includes(s)) {
    state.points = POINT_DEFS.map((d) => ({ ...d, status: "open" }));
  }
  if (s === "working") {
    state.flow = "working";
    state.points[0].status = "review"; state.points[1].status = "processing"; state.points[2].status = "open";
  }
  if (s === "review") { state.flow = "review"; state.points.forEach((p) => p.status = "review"); }
  if (s === "conflict") { state.flow = "review"; state.points.forEach((p) => p.status = "review"); state.conflict = true; }
  if (s === "archived") { state.flow = "archived"; state.points.forEach((p) => p.status = "resolved"); state.accepted = { p1: true, p2: true, p3: true }; }
  if (s === "delegate") state.flow = "delegate";
}

/* 把编辑点锚点画进正文：curated 点落在 data-q 引用上，即席点按引用文本查找包裹 */
function applyAnchors(doc) {
  for (const p of state.points) {
    if (p.status === "resolved" || p.status === "rejected") continue;
    if (state.accepted[p.para]) continue;
    let target = null;
    if (p.q) target = doc.querySelector(`[data-bid="${p.para}"] [data-q="${p.q}"]`);
    if (!target) target = wrapQuoteInPara(doc, p);
    if (!target) continue;
    target.classList.add("ep", p.status);

    if (state.flow === "review" && reviewPoints()[state.reviewIndex]?.id === p.id) target.classList.add("current");

    });

function wrapQuoteInPara(doc, p) {
  const para = doc.querySelector(`[data-bid="${p.para}"]`);
  if (!para) return null;
  const walker = document.createTreeWalker(para, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    const i = n.nodeValue.indexOf(p.quote);
    if (i < 0) continue;
    const r = document.createRange();
    r.setStart(n, i); r.setEnd(n, i + p.quote.length);
    const span = el("span");
    try { r.surroundContents(span); return span; } catch { return null; }
  }
  return null;
}

        quote: state.selText, intent: intent || (zh ? "这里需要解释。" : "Explain this."),
        explanation: zh
          ? "（演示）即席意图在真实产品中由 Agent 按 Thread 上下文回答；此处按「仅解释、不修改正文」收场——有些编辑点只需要解释。"
          : "(Demo) Ad-hoc intents are answered with thread context in the real product; here it resolves as explanation-only — some edit points need no text change.",
        impact: zh ? "无正文改动。" : "No text change.",
        diff: null, status: "open",
      };
  state.points.push(p);
  state.selInfo = null; state.selText = ""; state.selRect = null;
  if (state.flow === "reading") state.flow = "points";
  apply();
  const anchor = document.querySelector(`[data-pid="${p.id}"]`);
  if (anchor) {
    anchor.classList.add("flash-anchor");
    setTimeout(() => anchor.classList.remove("flash-anchor"), 1500);
  }
}

/* ---- 委派 ---- */
function openDelegate() {
  if (!openPoints().length) return;
  state.flow = "delegate"; state.surfaceManual = true;
  apply();
}
function confirmDelegate() {
  state.flow = "working";
  const first = state.points.find((p) => p.status === "open");
  if (first) first.status = "processing";
  apply();
  scheduleWork();
}
function scheduleWork() {
  stopWork();
  workTimer = setTimeout(() => {
    const doing = state.points.find((p) => p.status === "processing");
    if (doing) doing.status = "review";
    const next = state.points.find((p) => p.status === "open");
    if (next) { next.status = "processing"; apply(); scheduleWork(); }
    else finishWork();
  }, 950);
}
function stopWork() { if (workTimer) { clearTimeout(workTimer); workTimer = null; } }
function finishWork() {
  state.flow = "review"; state.reviewIndex = 0;
  apply();
  const t = T();
  showTone(t.tone_done(reviewPoints().length), t.tone_open);
}

/* ---- 回看裁决 ---- */
function decide(accept) {
  const pts = reviewPoints();
  const cur = pts[state.reviewIndex];
  if (!cur) return;
  cur.status = accept ? "resolved" : "rejected";
  let flashPara = null;
  if (accept && cur.q && FINAL[cur.para]) { state.accepted[cur.para] = true; flashPara = cur.para; }
  const remaining = reviewPoints();
  if (!remaining.length) {
    state.reviewIndex = 0;
    apply(flashPara);
    const t = T();
    showTone(t.arc_banner, t.arc_action, archiveAll);
    return;
  }
  state.reviewIndex = Math.min(state.reviewIndex, remaining.length - 1);
  apply(flashPara);
}
function stepReview(d) {
  const n = reviewPoints().length;
  if (!n) return;
  state.reviewIndex = Math.max(0, Math.min(n - 1, state.reviewIndex + d));
  apply();
}
function jumpToText() {
  const cur = reviewPoints()[state.reviewIndex];
  if (!cur) return;
  const anchor = document.querySelector(`[data-pid="${cur.id}"]`) || document.querySelector(`[data-bid="${cur.para}"]`);
  if (!anchor) return;
  anchor.scrollIntoView({ behavior: state.theme === "eink" ? "auto" : "smooth", block: "center" });
  anchor.classList.remove("flash-anchor");
  void anchor.offsetWidth;
  anchor.classList.add("flash-anchor");
  setTimeout(() => anchor.classList.remove("flash-anchor"), 1500);
}

/* ---- 归档：全部裁决后的显式动作，已解决点从正文消失 ---- */
function archiveAll() {
  if (state.flow === "archived" || reviewPoints().length) return;
  hideTone();
  state.flow = "archived"; state.surfaceManual = undefined;
  document.querySelectorAll(".ep").forEach((a) => a.classList.add("archiving"));
  setTimeout(() => {
    apply();
    const t = T();
    showToast(esc(t.arc_toast(state.points.length)));
  }, state.theme === "eink" ? 0 : 170);
}

/* ---- 冲突 popup ---- */
function renderConflict() {
  const t = T(); const layer = $("popup-layer");
  layer.replaceChildren();
  layer.classList.toggle("show", state.conflict);
  if (!state.conflict) return;
  const box = el("div", "popup");
  box.dataset.intent = "I15";
  box.append(el("div", "", `<span class="micro">${esc(t.conf_micro)}</span>`));
  box.append(el("div", "popup-title", esc(t.conf_title)));
  box.append(el("p", "", esc(t.conf_body)));
  const actions = el("div", "card-actions");
  for (const [label, fn] of [
    [t.conf_diff, () => showToast(esc(state.lang === "zh" ? "（演示）差异视图在真实产品中打开。" : "(Demo) The diff view opens in the real product."))],
    [t.conf_re, () => showToast(esc(state.lang === "zh" ? "（演示）已按当前磁盘版本重新处理。" : "(Demo) Reprocessed against the current disk version."))],
    [t.conf_keep, () => showToast(esc(state.lang === "zh" ? "（演示）已保留磁盘版本，批次作废。" : "(Demo) Disk version kept; batch discarded."))],
  ]) {
    const b = el("button", "btn", esc(label));
    b.addEventListener("click", () => { state.conflict = false; apply(); fn(); });
    actions.append(b);
  }
  box.append(actions);
  layer.append(box);
}

/* ---- 命令面板 ---- */
function paletteActions() {
  const t = T();
  const n = openPoints().length;
  const inReview = state.flow === "review" && reviewPoints().length > 0;
  return [
    { label: t.pa_create, sub: t.pa_createSub, k: t.pa_createKbd, enabled: !!state.selText && state.view !== "empty", run: () => showSelPop() },
    { label: t.pa_delegate(n), sub: t.pa_delegateSub, k: t.pa_delegateKbd, enabled: n > 0 && ["reading", "points"].includes(state.flow), run: openDelegate },
    { label: t.pa_accept, k: t.pa_acceptKbd, enabled: inReview, run: () => decide(true) },
    { label: t.pa_reject, k: t.pa_rejectKbd, enabled: inReview, run: () => decide(false) },
    { label: t.pa_jump, k: t.pa_jumpKbd, enabled: inReview, run: jumpToText },
    { label: t.pa_next, k: t.pa_nextKbd, enabled: inReview, run: () => stepReview(1) },
    { label: t.pa_prev, k: t.pa_prevKbd, enabled: inReview, run: () => stepReview(-1) },
    { label: t.pa_archive, sub: t.pa_archiveSub, enabled: state.flow === "review" && state.points.length > 0 && reviewPoints().length === 0, run: archiveAll },
    { label: t.pa_theme, k: t.pa_themeKbd, enabled: true, run: cycleTheme },
    { label: t.pa_nav, k: t.pa_navKbd, enabled: true, run: toggleNav },
    { label: t.pa_surface, k: t.pa_surfaceKbd, enabled: true, run: toggleSurface },
  ];
}
function togglePalette(open) {
  state.paletteOpen = open === undefined ? !state.paletteOpen : open;
  $("palette-layer").classList.toggle("show", state.paletteOpen);
  if (state.paletteOpen) {
    const input = $("pal-input");
    input.value = ""; state.palIndex = 0;
    renderPaletteList("");
    setTimeout(() => input.focus({ preventScroll: true }), 30);
  } else {
    document.activeElement?.blur();
  }
}
function renderPaletteList(q) {
  const t = T(); const host = $("pal-list"); host.replaceChildren();
  const query = q.trim().toLowerCase();
  const items = paletteActions().filter((a) => !query || (a.label + " " + (a.sub || "")).toLowerCase().includes(query));
  if (!items.length) { host.append(el("div", "pal-empty", esc(t.pal_empty))); return; }
  state.palItems = items;
  state.palIndex = Math.max(0, Math.min(state.palIndex, items.length - 1));
  items.forEach((a, i) => {
    const row = el("div", "pal-item" + (i === state.palIndex ? " active" : "") + (a.enabled ? "" : " disabled"));
    const lbl = el("div", "lbl");
    lbl.append(el("div", "", esc(a.label)));
    if (a.sub) lbl.append(el("div", "sub", esc(a.sub)));
    row.append(lbl);
    if (a.k) row.insertAdjacentHTML("beforeend", kbd(a.k));
    row.addEventListener("click", () => { if (a.enabled) { togglePalette(false); a.run(); } });
    row.addEventListener("mousemove", () => { if (state.palIndex !== i) { state.palIndex = i; renderPaletteList($("pal-input").value); } });
    host.append(row);
  });
}
function setupPalette() {
  $("pal-input").placeholder = T().pal_placeholder;
  $("pal-input").addEventListener("input", (e) => { state.palIndex = 0; renderPaletteList(e.target.value); });
  $("palette-layer").addEventListener("mousedown", (e) => { if (e.target === $("palette-layer")) togglePalette(false); });
}

/* ---- 工具栏动作 ---- */
function toggleNav() { state.navOpen = !state.navOpen; apply(); }
function toggleSurface() {
  state.surfaceManual = !$("surface").classList.contains("open");
  renderSurface(); renderToolbar();
  if (state.annotate) injectAnnotations();
}
function cycleTheme() {
  state.theme = { light: "dark", dark: "eink", eink: "light" }[state.theme];
  apply();
}

/* ---- 键盘 ---- */
document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  const key = e.key.toLowerCase();
  if (state.paletteOpen) {
    if (e.key === "Escape") togglePalette(false);
    else if (e.key === "ArrowDown") { e.preventDefault(); state.palIndex++; renderPaletteList($("pal-input").value); }
    else if (e.key === "ArrowUp") { e.preventDefault(); state.palIndex--; renderPaletteList($("pal-input").value); }
    else if (e.key === "Enter") {
      e.preventDefault();
      const a = (state.palItems || [])[state.palIndex];
      if (a && a.enabled) { togglePalette(false); a.run(); }
    }
    return;
  }
  if (e.target.tagName === "INPUT") return;
  if (mod && key === "k") { e.preventDefault(); togglePalette(); }
  else if (mod && key === "b") { e.preventDefault(); toggleNav(); }
  else if (mod && e.key === ".") { e.preventDefault(); toggleSurface(); }
  else if (mod && e.shiftKey && key === "l") { e.preventDefault(); cycleTheme(); }
  else if (mod && e.shiftKey && key === "d") {
    e.preventDefault();
    if (state.flow === "delegate") confirmDelegate();
    else if (openPoints().length && ["reading", "points"].includes(state.flow)) openDelegate();
  }
  else if (mod && key === "e") { e.preventDefault(); showSelPop(); }
  else if (mod && e.key === "Enter" && state.flow === "review") { e.preventDefault(); decide(true); }
  else if (mod && e.key === "Backspace" && state.flow === "review") { e.preventDefault(); decide(false); }
  else if (mod && e.key === "]" && state.flow === "review") { e.preventDefault(); stepReview(1); }
  else if (mod && e.key === "[" && state.flow === "review") { e.preventDefault(); stepReview(-1); }
  else if (mod && key === "j" && state.flow === "review") { e.preventDefault(); jumpToText(); }
  else if (e.key === "Escape") { hideSelPop(); hideTone(); if (state.conflict) { state.conflict = false; apply(); } }
});

/* ---- 总装 ---- */
function applyMeasure() {
  document.documentElement.style.setProperty("--measure", state.measure >= 1200 ? "none" : state.measure + "px");
}
function apply(flashPara) {
  const root = document.documentElement;
  root.dataset.theme = state.theme;
  root.lang = state.lang === "zh" ? "zh" : "en";
  $("app").classList.toggle("gray", state.gray);
  applyMeasure();
  renderToolbar(); renderNav(); renderDoc(flashPara); renderSurface();
  renderConflict(); renderStatusbar(); renderConsole();
  if (state.annotate) injectAnnotations();
}
setupSelection();
setupPalette();
apply();
</script>
</body>
</html>
