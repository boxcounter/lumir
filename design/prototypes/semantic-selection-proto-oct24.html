<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语义选中 · D4 覆盖范围可视化对比（原型）</title>
<style>
/* ============ tokens（取值对齐 src/style.css 现行登记值；原型自包含） ============ */
:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --fs-body: 13px; --fs-meta: 12px; --fs-label: 11.5px; --fs-micro: 10.5px;
  --r4: 4px; --r6: 6px; --r8: 8px; --r10: 10px;
}
:root, :root[data-theme="light"] {
  --frame: #f4f4f1; --card: #fdfdfc; --preview-bg: #ffffff; --code-bg: #f2f1ec;
  --border: #e3e2dd; --border-soft: #edece7;
  --text: #21201a; --text-2: #6e6c61; --text-3: #a9a79b;
  --syn: #8d8b7f; --tick: #6e6c61;
  --sel-band: #c6c5bf;
  --accent: #3a5fcd; --accent-tint: #eef1fb;
  --leak: #b5761a; --leak-soft: rgba(181,118,26,0.16);
  --ok: #2c7a4d; --ok-tint: #e9f4ec;
  --ghost-a: rgba(58,95,205,0.14); --ghost-b: rgba(58,95,205,0.03);
  --shadow-raise: 0 6px 22px rgba(0,0,0,0.10);
  --quote-bar: #d8d7d1; --hover: rgba(0,0,0,0.045);
}
:root[data-theme="dark"] {
  --frame: #1a1b1d; --card: #1f2022; --preview-bg: #26272b; --code-bg: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.095); --border-soft: rgba(255,255,255,0.055);
  --text: #e3e2db; --text-2: #9b9a91; --text-3: #62615b;
  --syn: #8b8a80; --tick: #a3a299;
  --sel-band: rgba(255,255,255,0.22);
  --accent: #8ba3ef; --accent-tint: rgba(128,152,232,0.15);
  --leak: #d9a75c; --leak-soft: rgba(217,167,92,0.14);
  --ok: #7cc093; --ok-tint: rgba(124,192,147,0.13);
  --ghost-a: rgba(139,163,239,0.16); --ghost-b: rgba(139,163,239,0.03);
  --shadow-raise: 0 6px 22px rgba(0,0,0,0.50);
  --quote-bar: rgba(255,255,255,0.14); --hover: rgba(255,255,255,0.06);
}
:root[data-theme="eink"] {
  --frame: #ffffff; --card: #ffffff; --preview-bg: #ffffff; --code-bg: #f0f0f0;
  --border: #000000; --border-soft: #b9b9b9;
  --text: #000000; --text-2: #3d3d3d; --text-3: #6e6e6e;
  --syn: #555555; --tick: #000000;
  --sel-band: #b9b9b9;
  --accent: #000000; --accent-tint: transparent; --accent-fill: #000000;
  --leak: #000000; --leak-soft: transparent;
  --ok: #000000; --ok-tint: transparent;
  --ghost-a: #dcdcdc; --ghost-b: #ffffff;
  --shadow-raise: none;
  --quote-bar: #000000; --hover: rgba(0,0,0,0.06);
}

/* ============ base ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--sans); font-size: var(--fs-body); color: var(--text); background: var(--frame);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  padding: 0 0 120px;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
b, strong { font-weight: 650; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 32px; }

/* ============ 页头 ============ */
.page-head { padding: 30px 0 6px; }
.kicker { font-size: var(--fs-micro); letter-spacing: 0.04em; color: var(--text-3); font-family: var(--mono); }
h1 { font-size: 21px; font-weight: 650; letter-spacing: -0.01em; margin-top: 6px; }
.lede { margin-top: 8px; max-width: 980px; font-size: 13px; line-height: 1.75; color: var(--text-2); }
.lede b { color: var(--text); }
.read-row { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; align-items: center; }
.read-item { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-label); color: var(--text-2); }
.swatch { display: inline-block; width: 22px; height: 12px; border-radius: 3px; border: 1px solid var(--border); }
.sw-sel { background: var(--sel-band); border-color: transparent; }
.sw-syn { background: transparent; border: 1px dashed var(--syn); }
.sw-leak { background: transparent; border: 1px dashed var(--leak); border-bottom-width: 2px; }
.sw-ghost { background: repeating-linear-gradient(45deg, var(--ghost-a) 0 4px, var(--ghost-b) 4px 8px); border-color: var(--accent); }

/* ============ 结论条 ============ */
.verdicts { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; margin: 18px 0 22px; }
.vbox { border: 1px solid var(--border); border-radius: var(--r10); background: var(--card); padding: 12px 14px; }
.vbox.in { border-left: 3px solid var(--accent); }
.vbox.out { border-left: 3px solid var(--text-3); }
.vbox h2 { font-size: var(--fs-meta); font-weight: 650; letter-spacing: 0.02em; }
.vbox h2 .tag { font-weight: 500; color: var(--text-3); margin-left: 6px; }
.vbox p { margin-top: 6px; font-size: var(--fs-label); line-height: 1.65; color: var(--text-2); }
.vbox .names { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.vname { font-size: var(--fs-micro); padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-2); background: var(--preview-bg); }

/* ============ 组标题 ============ */
.group-head { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 10px; }
.group-head h2 { font-size: 14px; font-weight: 650; }
.group-head .sub { font-size: var(--fs-label); color: var(--text-3); }

/* ============ 剖面卡片 ============ */
.case {
  border: 1px solid var(--border); border-radius: var(--r10); background: var(--card);
  padding: 14px 16px 12px; margin-bottom: 14px; scroll-margin-top: 20px;
}
.case.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.case-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 12px; cursor: pointer; }
.case-name { font-size: 14px; font-weight: 650; }
.case-id { font-family: var(--mono); font-size: var(--fs-micro); color: var(--text-3); }
.chip { font-size: var(--fs-micro); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.chip.in { border-color: var(--accent); color: var(--accent); background: var(--accent-tint); }
.chip.out { border-color: var(--border); color: var(--text-2); }
:root[data-theme="eink"] .chip.in { background: #000; color: #fff; border-color: #000; }
.case-meta { font-size: var(--fs-micro); color: var(--text-3); line-height: 1.6; }
.case-meta code, .case-why code, .vbox code, .cpanel code { font-family: var(--mono); font-size: 0.95em; color: var(--text-2); background: var(--code-bg); padding: 0 3px; border-radius: 3px; }

.states { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.state-cell { display: flex; flex-direction: column; border: 1px solid var(--border-soft); border-radius: var(--r8); overflow: hidden; background: var(--preview-bg); min-width: 0; }
.state-cell.wide { grid-column: 1 / -1; }
.state-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 5px 9px; border-bottom: 1px solid var(--border-soft); background: var(--frame);
  font-size: var(--fs-micro); color: var(--text-2); font-weight: 600; letter-spacing: 0.02em;
}
.state-head .badge { font-weight: 500; letter-spacing: 0; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-3); white-space: nowrap; }
.badge.warn { border-color: var(--leak); color: var(--leak); background: var(--leak-soft); }
.badge.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-tint); }
.badge.acc { border-color: var(--accent); color: var(--accent); background: var(--accent-tint); }
:root[data-theme="eink"] .badge.acc { background: #000; color: #fff; border-color: #000; }
.badge.mute { color: var(--text-3); }

/* 渲染面：近似编辑器 live preview 的排版（15px；行高按 app 的 25px 档 ≈ 1.7） */
.view {
  flex: 1; padding: 10px 13px; font-size: 15px; line-height: 1.7; color: var(--text);
  overflow-wrap: anywhere;
}
.ln { min-height: 25.5px; }
.ln.quote { border-left: 2px solid var(--quote-bar); padding-left: 9px; color: var(--text-2); margin: 1px 0; }
.ln.callout-first { border-left: 2px solid var(--accent); padding-left: 9px; background: var(--accent-tint); border-radius: 0 var(--r4) var(--r4) 0; }
.ln.li { padding-left: 19px; text-indent: -19px; }
.hl { background: var(--sel-band); }
.syn { color: var(--syn); }
.syn.hidden { display: none; }
.tick { color: var(--tick); opacity: 0.75; }
.leak { border-bottom: 2px dotted var(--leak); background: var(--leak-soft); }
.t-h2 { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
.t-strong { font-weight: 650; }
.t-em { font-style: italic; }
.t-strike { text-decoration: line-through; color: var(--text-2); }
.t-se { font-weight: 650; font-style: italic; }
.t-link { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.t-code { font-family: var(--mono); font-size: 0.88em; background: var(--code-bg); border-radius: 3px; padding: 1px 4px; }
.t-ctitle { font-weight: 650; }
.w-bullet { display: inline-block; width: 19px; color: var(--text-3); text-indent: 0; }
.w-wl { color: var(--accent); }
.w-linkmark { color: var(--text-3); font-size: 11px; margin-left: 2px; }
.w-callout {
  display: inline-block; margin-right: 7px; padding: 0 5px; border-radius: 3px;
  font-size: 10.5px; font-weight: 650; letter-spacing: 0.02em;
  color: var(--accent); background: var(--accent-tint); vertical-align: 1px;
}
.w-callout .en { font-weight: 500; letter-spacing: 0.06em; opacity: 0.72; }
:root[data-theme="eink"] .w-callout { background: #000; color: #fff; }
.hl .w-callout, .hl .w-wl, .hl .w-linkmark { border-radius: 3px; }

/* 源码条 */
.src {
  border-top: 1px dashed var(--border-soft); padding: 6px 10px 7px; background: var(--code-bg);
  font-family: var(--mono); font-size: 11px; line-height: 1.6; color: var(--text-2);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.src .srcln { display: block; }
.src .sel { background: var(--sel-band); color: var(--text); border-radius: 2px; }
.src .ghosty { background: repeating-linear-gradient(45deg, var(--ghost-a) 0 4px, var(--ghost-b) 4px 8px); border-radius: 2px; }
.cell-note { padding: 6px 10px 8px; border-top: 1px dashed var(--border-soft); font-size: var(--fs-micro); line-height: 1.6; color: var(--text-3); }
.cell-note b { color: var(--text-2); font-weight: 600; }
.cell-note.warn b { color: var(--leak); }
.cell-note .add { font-family: var(--mono); color: var(--text-2); background: var(--code-bg); padding: 0 3px; border-radius: 3px; }
.cell-note .ghostnote { display: block; margin-top: 4px; padding-left: 8px; border-left: 2px solid transparent; border-image: repeating-linear-gradient(45deg, var(--ghost-a) 0 4px, var(--ghost-b) 4px 8px) 1; color: var(--text-3); }
.case-why { margin-top: 10px; font-size: var(--fs-label); line-height: 1.7; color: var(--text-2); }
.case-why .lead { color: var(--text-3); margin-right: 4px; }
.case.dim { opacity: 0.55; }

/* 整块替换剖面的样张 */
.block-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; padding: 10px 12px; }
.bsample { border: 1px solid var(--border-soft); border-radius: var(--r6); overflow: hidden; background: var(--card); display: flex; flex-direction: column; }
.bs-name { padding: 5px 8px; font-size: var(--fs-micro); color: var(--text-3); border-bottom: 1px solid var(--border-soft); background: var(--frame); }
.bs-view { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px 10px; min-height: 78px; }
.bs-src { padding: 5px 8px; border-top: 1px dashed var(--border-soft); background: var(--code-bg); font-family: var(--mono); font-size: 10px; line-height: 1.55; color: var(--text-3); white-space: pre-wrap; overflow-wrap: anywhere; }
.bs-note { padding: 4px 8px 6px; font-size: var(--fs-micro); color: var(--text-3); line-height: 1.5; }

.ph-img {
  width: 100%; height: 58px; border: 1px dashed var(--border); border-radius: var(--r4);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--text-3); font-size: var(--fs-micro); background: var(--frame);
}
.ph-img .glyph { font-size: 17px; line-height: 1; }
.ph-math { font-family: "Times New Roman", Georgia, serif; font-size: 19px; font-style: italic; letter-spacing: 0.02em; color: var(--text); }
.ph-mmd { display: flex; align-items: center; gap: 6px; font-size: var(--fs-micro); color: var(--text-2); }
.ph-mmd .node { border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; background: var(--frame); }
.ph-mmd .arw { color: var(--text-3); }
.ph-fm { width: 100%; font-size: var(--fs-micro); color: var(--text-2); border: 1px solid var(--border-soft); border-radius: var(--r4); overflow: hidden; }
.ph-fm .row { display: flex; gap: 8px; padding: 3px 7px; border-bottom: 1px solid var(--border-soft); }
.ph-fm .row:last-child { border-bottom: none; }
.ph-fm .k { color: var(--text-3); min-width: 44px; }
.ph-hr { width: 100%; }
.ph-hr hr { border: none; border-top: 1px solid var(--border); }

/* ============ 控制面板（硬规则：全部选项点击可达；panel=0 供截图隐藏） ============ */
.cpanel {
  position: fixed; right: 16px; bottom: 16px; z-index: 100; width: 352px; max-height: calc(100vh - 32px); overflow: auto;
  background: var(--preview-bg); border: 1px solid var(--border); border-radius: var(--r8);
  box-shadow: var(--shadow-raise); padding: 10px 12px; font-size: var(--fs-meta);
}
.cpanel[hidden] { display: none; }
.cp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.cp-head h2 { font-size: var(--fs-meta); font-weight: 650; }
.cp-row { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.cp-label { flex: none; width: 58px; color: var(--text-3); font-size: var(--fs-micro); }
.cp-btn {
  padding: 2px 8px; border: 1px solid var(--border); border-radius: var(--r4);
  font-size: var(--fs-micro); color: var(--text-2);
}
.cp-btn:hover { background: var(--hover, rgba(0,0,0,0.04)); color: var(--text); }
.cp-btn.is-on { background: var(--accent-tint); color: var(--accent); border-color: var(--accent); }
:root[data-theme="eink"] .cp-btn.is-on { background: #000; color: #fff; border-color: #000; }
.cp-btn.ghostbtn { border-style: dashed; }
.cp-note { margin-top: 8px; font-size: var(--fs-micro); color: var(--text-3); line-height: 1.55; }
.panel-restore {
  position: fixed; right: 16px; bottom: 16px; z-index: 100;
  padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px;
  background: var(--preview-bg); box-shadow: var(--shadow-raise); font-size: var(--fs-micro); color: var(--text-2);
}
.panel-restore[hidden] { display: none; }

@media (max-width: 1100px) {
  .states { grid-template-columns: minmax(0, 1fr) !important; }
  .verdicts { grid-template-columns: 1fr; }
  .wrap { padding: 0 18px; }
}
</style>
</head>
<body>
<div id="root"></div>
<div id="cpanel"></div>
<button type="button" class="panel-restore" id="panelRestore" hidden>控制面板</button>
<script>
"use strict";

/* ============================================================
   参数：query 只作深链；一切选项在控制面板点击可达
   ?theme=light|dark|eink   ?group=all|in|out   ?states=all|drag|now|after
   ?link=in|out             ?ghost=1|0          ?case=<id> （别名 ?type=）
   ?panel=0 关控制面板（截图用）
   ============================================================ */
const q = new URLSearchParams(location.search);
const pick = (key, allowed, fallback) => (allowed.includes(q.get(key)) ? q.get(key) : fallback);
const state = {
  theme: pick("theme", ["light", "dark", "eink"], "light"),
  group: pick("group", ["all", "in", "out"], "all"),
  states: pick("states", ["all", "drag", "now", "after"], "all"),
  link: pick("link", ["in", "out"], "in"),
  ghost: q.get("ghost") !== "0",
  focus: q.get("case") || q.get("type") || null,
  panel: q.get("panel") !== "0",
};
const panelForcedOff = q.get("panel") === "0";

/* ============================================================
   合成 fixture：全部虚构，零真实 vault 内容
   ============================================================ */
const T = (s, st, g) => ({ t: "tx", s, st, g });
const S = (s, g) => ({ t: "syn", s, rev: g ? "node" : "line", g });
const V = (s) => ({ t: "vis", s });
const W = (o) => ({ t: "w", ...o });

const CASES = [
  {
    id: "heading", group: "in", name: "ATX 标题", syntax: "# … ######",
    hidden: "定界串 + 紧随一个空格（闭合 # 串一并）",
    gate: "整行含端点相接（M297）",
    why: "标题的定界符是行级概念：选区落在标题行即整行显露（M297），外扩目标就是整行源码范围。引用卡片因此保留 `##`，层级不丢。标题样式在显露态保留，只有标记上屏。",
    samples: [{
      lines: [
        [S("## "), T("Release Checklist", "h2")],
        [T("Shipped Friday; two items moved to next week.")],
      ],
      sel: { drag: ["Release Checklist"], after: ["## Release Checklist"] },
    }],
  },
  {
    id: "emphasis", group: "in", name: "强调系", syntax: "** __ * _ ~~",
    hidden: "两侧定界符（含 *** 与嵌套）",
    gate: "节点含端点相接（M168）",
    why: "强调系的显露判据是节点含端点相接（M168）；显露时样式一并撤下，整段按源码显示。外扩到两侧定界符后，摘录保留 `**` 语义。`__` / `_` 与 `**` / `*` 同属强调系，走同一条规则；本例覆盖 `**` / `*` / `~~` / `__` / `***` 五种形态。",
    samples: [{
      lines: [
        [T("Ship the "), S("**", "e0"), T("final", "strong", "e0"), S("**", "e0"), T(" build today.")],
        [T("Flag "), S("*", "e1"), T("anything", "em", "e1"), S("*", "e1"), T(" odd in the log.")],
        [T("Mark "), S("~~", "e2"), T("stale", "strike", "e2"), S("~~", "e2"), T(" rows before you tag.")],
        [T("Keep "), S("__", "e4"), T("draft", "strong", "e4"), S("__", "e4"), T(" copies out.")],
        [T("Then rewrite "), S("***", "e3"), T("bold italics", "se", "e3"), S("***", "e3"), T(" twice.")],
      ],
      sel: {
        drag: ["final", "anything", "stale", "draft", "bold italics"],
        after: ["**final**", "*anything*", "~~stale~~", "__draft__", "***bold italics***"],
      },
    }],
  },
  {
    id: "link", group: "in", name: "标准链接", syntax: "[label](target)",
    hidden: "`[` 与 `](target)`（尾部另出链接标记）",
    gate: "节点严格重叠（M145）",
    why: "链接一经选区触及，整条 `[label](target)` 按源码上屏（M145）。外扩目标就是节点范围，与「节点范围 = 外扩目标」同一条规则。代价见右侧读数：引用卡片会带上 URL——嫌噪声可在控制面板把「链接处置」切到备选，下格会实时改成不外扩。",
    samples: [{
      lines: [
        [T("See the "), S("[", "l0"), T("build log", "link", "l0"),
         S("](https://example.invalid/lantern/build)", "l0"), W({ kind: "linkmark", s: "", glyph: "↗" }),
         T(" for details.")],
      ],
      sel: { drag: ["build log"], after: ["[build log](https://example.invalid/lantern/build)"] },
    }],
  },
  {
    id: "code", group: "out", name: "行内代码", syntax: "`x`",
    hidden: "无——反引号本来就可见（M295 只换选区底色）",
    gate: "无（不存在隐藏后显露的时点）",
    why: "反引号一直在屏上，没有「隐藏 → 显露」的时点，所以不存在「上屏但未选中」的缺口：选区边界所见即所得，想含反引号就把指针拖到它上面。不需要外扩，也不需要排除逻辑。",
    samples: [{
      lines: [
        [T("Run "), V("`"), T("pnpm gate", "code"), V("`"), T(" before pushing.")],
      ],

if (state.focus && !CASES.some((c) => c.id === state.focus)) state.focus = null;

/* ============================================================
   选区模型：源码字符区间（absolute offset）
   ============================================================ */
function buildSample(sample) {
  let offset = 0;
  const lines = sample.lines.map((atoms) => {
    const lineFrom = offset;
    const built = atoms.map((a) => {
      const from = offset;
      const to = offset + a.s.length;
      offset = to;
      return { ...a, from, to };
    });
    const line = { atoms: built, from: lineFrom, to: offset };
    offset += 1; // 源码行之间的换行符（与下方 join("\n") 对齐）
    return line;
  });
  const src = lines.map((l) => l.atoms.map((a) => a.s).join("")).join("\n");
  const find = (needle) => {
    const i = src.indexOf(needle);
    if (i < 0) throw new Error("fixture needle 未命中: " + needle);
    if (src.indexOf(needle, i + 1) >= 0) throw new Error("fixture needle 不唯一: " + needle);
    return { from: i, to: i + needle.length };
  };
  const resolve = (list) => (list || []).map(find);
  return { lines, src, drag: resolve(sample.sel.drag), after: resolve(sample.sel.after) };
}

const BUILT = new Map();
function builtOf(c) {
  if (c.blocks) return null;
  if (!BUILT.has(c.id)) {
    const s = c.samples[0];
    BUILT.set(c.id, buildSample(s));
  }
  return BUILT.get(c.id);
}

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const selLen = (ranges) => ranges.reduce((n, r) => n + (r.to - r.from), 0);
const inRanges = (pos, ranges) => ranges.some((r) => pos >= r.from && pos < r.to);
const touched = (from, to, ranges) => ranges.some((r) => r.from <= to && r.to >= from);

/** 把一段文本按选区切成 [{text, sel}]；selected 之外的回调决定附加 class。 */
function segments(from, text, ranges, extraClass) {
  const out = [];
  let cur = null;
  for (let i = 0; i < text.length; i++) {
    const sel = inRanges(from + i, ranges);
    const cls = (sel ? "hl " : "") + (extraClass ? extraClass(from + i, sel) : "");
    const key = cls.trim();
    if (!cur || cur.key !== key) {
      cur = { key, cls: key, text: "" };
      out.push(cur);
    }
    cur.text += text[i];
  }
  return out;
}

function atomHTML(a, ctx) {
  if (a.t === "w") return widgetHTML(a, ctx);
  const revealed = a.t === "syn"
    ? (a.rev === "node" ? ctx.groups.has(a.g) : ctx.lineTouched)
    : true;
  if (a.t === "syn" && !revealed) return "";
  let base = "";
  if (a.t === "syn") base = "syn";
  else if (a.t === "vis") base = "tick";
  else if (a.t === "tx") {
    if (a.st && ctx.groups.has(a.g)) base = a.st === "h2" || a.st === "code" || a.st === "ctitle" ? "t-" + a.st : "";
    else if (a.st) base = "t-" + a.st;
  }
  const leakable = a.t === "syn" && revealed;
  const extra = leakable
    ? (pos, sel) => (sel ? "" : "leak")
    : null;
  return segments(a.from, a.s, ctx.ranges, extra)
    .map((seg) => (seg.cls ? `<span class="${seg.cls}">${esc(seg.text)}</span>` : esc(seg.text)))
    .join("");
}

function widgetHTML(a, ctx) {
  const revealed = a.rev === "line" && ctx.lineTouched;
  if (revealed) {
    return segments(a.from, a.s, ctx.ranges, (pos, sel) => (sel ? "" : "leak"))
      .map((seg) => `<span class="syn ${seg.cls}">${esc(seg.text)}</span>`)
      .join("");
  }
  const selected = a.s.length > 0 && ctx.ranges.some((r) => r.from <= a.from && r.to >= a.to);
  const hl = selected ? " hl" : "";
  switch (a.kind) {
    case "bullet": return `<span class="w-bullet${hl}">–</span>`;
    case "wl": return `<span class="w-wl${hl}">${esc(a.label)}</span>`;
    case "linkmark": return `<span class="w-linkmark">${esc(a.glyph)}</span>`;
    case "callout": {
      const [zh, en] = a.label.split(" ");
      return `<span class="w-callout${hl}">${esc(zh)}${en ? ` <span class="en">${esc(en)}</span>` : ""}</span>`;
    }
    default: return "";
  }
}

/** 单元格渲染：preview + 源码条 + 读数 */
function cellHTML(c, cellState) {
  const built = builtOf(c);
  const expands = c.group === "in" && !(c.id === "link" && state.link === "out");
  const ranges = cellState === "after" && expands ? built.after : built.drag;
  const groups = new Set();
  if (cellState !== "drag") {
    for (const line of built.lines) {
      for (const a of line.atoms) {
        if (!a.g) continue;
        const span = line.atoms.filter((x) => x.g === a.g).reduce(
          (acc, x) => ({ from: Math.min(acc.from, x.from), to: Math.max(acc.to, x.to) }),
          { from: a.from, to: a.to },
        );
        if (ranges.some((r) => r.from < span.to && r.to > span.from)) groups.add(a.g);
      }
    }
  }
  const viewLines = built.lines.map((line) => {
    const touchedLine = cellState !== "drag" && touched(line.from, line.to, ranges);
    const ctx = { ranges, groups, lineTouched: touchedLine };
    const html = line.atoms.map((a) => atomHTML(a, ctx)).join("");
    let cls = "ln";
    if (line.atoms.some((a) => a.t === "syn" && a.s.startsWith(">"))) cls += " quote";
    if (line.atoms.some((a) => a.kind === "bullet")) cls += " li";
    if (line.atoms.some((a) => a.kind === "callout")) cls += " callout-first";
    return `<div class="${cls}">${html || "&nbsp;"}</div>`;
  }).join("");

  let leak = 0;
  let leakText = "";
  for (const line of built.lines) {
    if (!(cellState !== "drag" && touched(line.from, line.to, ranges))) continue;
    for (const a of line.atoms) {
      if (a.t !== "syn") continue;
      const vis = a.rev === "node" ? groups.has(a.g) : true;
      if (!vis) continue;
      for (let i = 0; i < a.s.length; i++) {
        if (!inRanges(a.from + i, ranges)) { leak++; leakText += a.s[i]; }
      }
    }
  }
  const srcHTML = built.lines.map((line) => {
    const text = line.atoms.map((a) => a.s).join("");
    const ghost = state.ghost && c.ghost && cellState === "after" ? built.ghostRange || null : null;
    return `<span class="srcln">${lineSourceHTML(line, text, ranges, ghost)}</span>`;
  }).join("");
  const added = addedText(built, ranges, built.drag);
  return {
    view: `<div class="view">${viewLines}</div>`,
    src: `<div class="src">${srcHTML}</div>`,
    leak, leakText, added,
  };
}

/** 源码条：按选区与反事实区间着色 */
function lineSourceHTML(line, text, ranges, ghost) {
  const ghostRange = ghost && ghost.line === line ? ghost.range : null;
  let out = "";
  for (let i = 0; i < text.length; i++) {
    const pos = line.from + i;
    const cls = [];
    if (inRanges(pos, ranges)) cls.push("sel");
    if (ghostRange && pos >= ghostRange.from && pos < ghostRange.to) cls.push("ghosty");
    out += cls.length ? `<span class="${cls.join(" ")}">${esc(text[i])}</span>` : esc(text[i]);
  }
  return out;
}

function addedText(built, ranges, base) {
  let out = "";
  for (const r of ranges) {
    for (let pos = r.from; pos < r.to; pos++) {
      if (!inRanges(pos, base)) out += built.src[pos];
    }
  }
  return out;
}

/* 反事实区间：needle 落在某一行 → 解析行内范围（len 可只取前缀） */
function ghostOf(c) {
  const g = c.ghost;
  if (!g) return null;
  const built = builtOf(c);
  const i = built.src.indexOf(g.needle);
  if (i < 0) throw new Error("ghost needle 未命中: " + g.needle);
  const line = built.lines.find((l) => i >= l.from && i < l.to);
  const len = g.len || g.needle.length;
  return line ? { line, range: { from: i, to: i + len } } : null;
}

function badgeFor(c, cellState, m) {
  if (c.group === "out" && cellState === "after") {
    return m.leak > 0
      ? `<span class="badge warn">不外扩 · 仍有 ${m.leak} 字符上屏未选中</span>`
      : `<span class="badge mute">不外扩 · 无缺口</span>`;

  if (c.id === "link" && state.link === "out" && cellState === "after") {
    return `<span class="badge warn">备选 · ${m.leak} 字符上屏未选中</span>`;
  }
  if (cellState === "drag") return `<span class="badge mute">选区 ${m.selCount} 字符</span>`;
  if (cellState === "now") {
    return m.leak > 0
      ? `<span class="badge warn">上屏未选中 ${m.leak} 字符</span>`
      : `<span class="badge ok">无缺口</span>`;

  return m.added.length
    ? `<span class="badge acc">外扩 +${m.added.length} 字符</span>`
    : `<span class="badge mute">不外扩</span>`;
}

const showWS = (s) => esc(s).replace(/ /g, "·").replace(/\n/g, "⏎");
const clip = (s, n = 28) => (s.length > n ? s.slice(0, n) + "…" : s);

function noteFor(c, cellState, m) {

}

const NO_EXPAND = {
  code: "反引号一直在屏上，没有可外扩的隐藏字符。",
  list: "标记被 glyph widget 整体替换，没有可对齐的上屏字符。",
  quote: "行级前缀，跨行与语义都要另立规则，v1 不做。",
  callout: "类型标记与 `>` 是块级前缀，v1 不做。",
  wikilink: "整条是原子 widget，源码选区已含整条，外扩无对象。",
};
const whyShort = (c) => NO_EXPAND[c.id] || "";

function caseHTML(c) {
  const cols = c.blocks ? 1 : visibleStates().length;
  const built = builtOf(c);
  const states = c.blocks ? ["blocks"] : visibleStates();
  const cells = c.blocks
    ? blocksCell(c)
    : states.map((s) => {
        const m = cellHTML(c, s);
        m.selCount = selLen(s === "after" && c.group === "in" && !(c.id === "link" && state.link === "out") ? built.after : built.drag);
        const warn = m.leak > 0 && (s === "now" || c.group === "out");
        return `<div class="state-cell">
          <div class="state-head"><span>${STATE_META[s].name}</span>${badgeFor(c, s, m)}</div>
          ${m.view}${m.src}
          <div class="cell-note ${warn ? "warn" : ""}">${noteFor(c, s, m)}</div>
        </div>`;
      }).join("");

  return `<section class="case${state.focus === c.id ? " focus" : ""}" id="case-${c.id}" data-case="${c.id}">
    <div class="case-head" data-focus="${c.id}">
      <span class="case-name">${esc(c.name)}</span>
      <span class="chip ${c.group}">${c.group === "in" ? "纳入" : "不纳入"}</span>
      <span class="case-id">${esc(c.id)}</span>
      <span class="case-meta">隐藏：${esc(c.hidden)} · 判据：${esc(c.gate)} · 源码 <code>${esc(c.syntax)}</code></span>
    </div>
    <div class="states" style="--cols:${cols}">${cells}</div>
    <div class="case-why"><span class="lead">为什么</span>${md(c.why)}</div>
  </section>`;
}

function blocksCell(c) {
  const grid = c.blocks.map((b) => `<div class="bsample">
      <div class="bs-name">${esc(b.name)}</div>
      <div class="bs-view">${b.view}</div>
      <div class="bs-src">${b.src.map(esc).join("\n")}</div>
      <div class="bs-note">${esc(b.note)}</div>
    </div>`).join("");
  return `<div class="state-cell wide">
    <div class="state-head"><span>三态相同</span><span class="badge mute">无可拖选文本 · 无选区可对比</span></div>
    <div class="block-grid">${grid}</div>
    <div class="cell-note"><b>无差异</b>：五类都是整块替换的 widget，没有渲染态文本可拖选，因此「拖选中 / 松手」没有可比较的选区形态。</div>
  </div>`;
}

/** 极简 markdown：仅 `code` 与 **粗体**（作者写的注释用） */
function md(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}

function boardHTML() {
  const groups = [["in", "纳入系", "松手时外扩到节点源码范围"], ["out", "不纳入系", "三态一致，或缺口按设计保留"]];
  return groups.map(([g, title, sub]) => {
    const cases = CASES.filter((c) => c.group === g && (state.group === "all" || state.group === g || state.focus === c.id));
    if (!cases.length) return "";
    return `<div class="wrap"><div class="group-head"><h2>${title}</h2><span class="sub">${sub}</span></div>${cases.map(caseHTML).join("")}</div>`;
  }).join("");
}

function cpanelHTML() {
  const btn = (k, v, label, on, extra = "") =>
    `<button type="button" class="cp-btn${on ? " is-on" : ""} ${extra}" data-k="${k}" data-v="${v}">${label}</button>`;
  const themeBtns = ["light", "dark", "eink"].map((t) => btn("theme", t, t, state.theme === t)).join("");
  const groupBtns = [["all", "全部"], ["in", "纳入系"], ["out", "不纳入系"]]
    .map(([v, l]) => btn("group", v, l, state.group === v)).join("");
  const stateBtns = [["all", "三态并排"], ["drag", "仅拖选中"], ["now", "仅松手·现状"], ["after", "仅松手·D1=A"]]
    .map(([v, l]) => btn("states", v, l, state.states === v)).join("");
  const linkBtns = [["in", "纳入（倾向）"], ["out", "不纳入（备选）"]]
    .map(([v, l]) => btn("link", v, l, state.link === v)).join("");
  const ghostBtns = [["1", "显示取证"], ["0", "隐藏"]]
    .map(([v, l]) => btn("ghost", v, l, (v === "1") === state.ghost)).join("");
  const shortName = { heading: "标题", emphasis: "强调", link: "链接", code: "行内代码", list: "列表", quote: "引用", callout: "callout", wikilink: "wikilink", blocks: "整块替换" };
  const focusBtns = focusButtons(shortName);
  return `<div class="cpanel">
    <div class="cp-head"><h2>控制面板</h2><button type="button" class="cp-btn" data-k="panel" data-v="0">隐藏</button></div>
    <div class="cp-row"><span class="cp-label">主题</span>${themeBtns}</div>
    <div class="cp-row"><span class="cp-label">语法组</span>${groupBtns}</div>
    <div class="cp-row"><span class="cp-label">状态列</span>${stateBtns}</div>
    <div class="cp-row"><span class="cp-label">链接处置</span>${linkBtns}</div>
    <div class="cp-row"><span class="cp-label">反事实取证</span>${ghostBtns}</div>
    <div class="cp-row"><span class="cp-label">定位剖面</span>${focusBtns}</div>
    <div class="cp-note">全部选项点击可达；当前选择写回 URL 作深链（<code>?theme=&amp;group=&amp;states=&amp;link=&amp;ghost=&amp;case=</code>）。截图用 <code>?panel=0</code> 关本面板。内容全为合成 fixture。</div>
  </div>`;
}
function focusButtons(shortName) {
  const all = `<button type="button" class="cp-btn${state.focus ? "" : " is-on"}" data-k="case" data-v="">全部</button>`;
  return all + CASES.map((c) =>
    `<button type="button" class="cp-btn${state.focus === c.id ? " is-on" : ""}" data-k="case" data-v="${c.id}">${shortName[c.id] || c.name}</button>`,
  ).join("");
}

function render() {
  document.documentElement.dataset.theme = state.theme;
  const y = window.scrollY;
  document.getElementById("root").innerHTML = headHTML() + boardHTML();
  const host = document.getElementById("cpanel");
  host.innerHTML = cpanelHTML();
  host.hidden = !state.panel;
  const restore = document.getElementById("panelRestore");
  restore.hidden = state.panel || panelForcedOff;
  window.scrollTo(0, y);
  if (state.focus) {
    const el = document.getElementById("case-" + state.focus);
    if (el) el.scrollIntoView({ block: "start" });
  }
  document.title = `语义选中 · D4 覆盖范围可视化对比（${state.theme}）`;
}

/* ============================================================
   交互：写入 URL（深链）后重渲染
   ============================================================ */
function setState(key, value) {
  if (key === "panel") {
    state.panel = value !== "0";
  } else if (key === "ghost") {
    state.ghost = value !== "0";
  } else if (key === "case") {
    state.focus = value || null;
  } else {
    state[key] = value;
  }
  const p = new URLSearchParams(location.search);
  const map = { theme: "theme", group: "group", states: "states", link: "link", ghost: "ghost", focus: "case", panel: "panel" };
  if (key === "ghost") p.set("ghost", state.ghost ? "1" : "0");
  else if (key === "panel") { if (state.panel) p.delete("panel"); else p.set("panel", "0"); }
  else if (key === "case") { if (state.focus) p.set("case", state.focus); else p.delete("case"); }
  else p.set(map[key], state[key]);
  history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p.toString() : ""));
  render();
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-k]");
  if (b) { setState(b.dataset.k, b.dataset.v); return; }
  const f = e.target.closest("[data-focus]");
  if (f) {
    // 拖选文本（想复制读数）时不抢点击
    if (String(window.getSelection() || "").trim()) return;
    setState("case", state.focus === f.dataset.focus ? "" : f.dataset.focus);
  }
});
document.getElementById("panelRestore").addEventListener("click", () => {
  state.panel = true;
  const p = new URLSearchParams(location.search);
  p.delete("panel");
  history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p.toString() : ""));
  render();
});

/* 反事实区间挂到各 case 的 built 上（延迟解析，避免 needle 拼错时静默） */
for (const c of CASES) {
  if (!c.ghost) continue;
  const built = builtOf(c);
  built.ghostRange = ghostOf(c);
}
render();
</script>
</body>
</html>
