<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumir — harness 工具行 + 批准卡收敛原型（M401）</title>
<style>
/* ============ tokens（逐值取自 src/style.css 现行登记值；原型自包含，不 import 仓内 css） ============ */
:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  /* 非色 token（三主题共享，与 style.css :root 同值） */
  --fs-ui: 13px; --fs-ui-s: 12.5px; --fs-meta: 12px; --fs-label-s: 11.5px; --fs-label: 11px; --fs-micro: 10.5px;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 650;
  --lh-ui: 1.5; --lh-code: 1.55;
  --sp-1: 2px; --sp-2: 4px; --sp-3: 6px; --sp-4: 8px; --sp-5: 10px; --sp-6: 12px;
  --r4: 4px; --r5: 5px; --r6: 6px; --r8: 8px;
  --dur-ui: 0.12s; --ease-standard: ease;
  --pulse-cycle: 1.6s ease-in-out infinite;
}
:root, :root[data-theme="light"] {
  --frame: #f4f4f1;
  --agent-bg: #f7f7f4;
  --content-bg: #fdfdfc;
  --preview-bg: #ffffff;
  --border: #e3e2dd;
  --border-soft: #edece7;
  --text: #21201a;
  --text-2: #6e6c61;
  --text-3: #a9a79b;
  --sel: #e8e7e1;
  --hover: rgba(0,0,0,0.038);
  --accent: #3a5fcd;
  --accent-tint: #eef1fb;
  --accent-fill: #3a5fcd;
  --accent-fill-text: #ffffff;
  --pending: #a06e0f;
  --ok: #2c7a4d;
  --ok-tint: #e9f4ec;
  --danger: #bf4438;
  --danger-tint: #f9ecea;
  --run: #3a5fcd;
  --code-bg: #f2f1ec;
  --shadow-raise: 0 4px 16px rgba(0,0,0,0.10);
}
:root[data-theme="dark"] {
  --frame: #1a1b1d;
  --agent-bg: #1e1f21;
  --content-bg: #222326;
  --preview-bg: #26272b;
  --border: rgba(255,255,255,0.095);
  --border-soft: rgba(255,255,255,0.055);
  --text: #e3e2db;
  --text-2: #9b9a91;
  --text-3: #62615b;
  --sel: rgba(255,255,255,0.075);
  --hover: rgba(255,255,255,0.05);
  --accent: #8ba3ef;
  --accent-tint: rgba(128,152,232,0.15);
  --accent-fill: #647ecf;
  --accent-fill-text: #ffffff;
  --pending: #d9a75c;
  --ok: #7cc093;
  --ok-tint: rgba(124,192,147,0.13);
  --danger: #e08a80;
  --danger-tint: rgba(224,138,128,0.13);
  --run: #8ba3ef;
  --code-bg: rgba(255,255,255,0.05);
  --shadow-raise: 0 4px 16px rgba(0,0,0,0.50);
}
:root[data-theme="eink"] {
  --frame: #ffffff;
  --agent-bg: #ffffff;
  --content-bg: #ffffff;
  --preview-bg: #ffffff;
  --border: #000000;
  --border-soft: #b9b9b9;
  --text: #000000;
  --text-2: #3d3d3d;
  --text-3: #6e6e6e;
  --sel: #b9b9b9;
  --hover: rgba(0,0,0,0.06);
  --accent: #000000;
  --accent-tint: transparent;
  --accent-fill: #000000;
  --accent-fill-text: #ffffff;
  --pending: #000000;
  --ok: #000000;
  --ok-tint: transparent;
  --danger: #000000;
  --danger-tint: transparent;
  --run: #000000;
  --code-bg: #f0f0f0;
  --shadow-raise: none;
}

/* ============ base ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--text);
  background: var(--frame);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; background: none; border: none; }
b { font-weight: var(--fw-semibold); }

/* ============ harness 面板复刻（宽 348 = --layout-agent-w） ============ */
.hp {
  width: 348px;
  background: var(--agent-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.hp-transcript {
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  font-size: var(--fs-ui);
  line-height: var(--lh-ui);
}

/* who meta 行（harness-panel.css .lumir-hp-who） */
.who {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin-bottom: var(--sp-1);
  font-size: var(--fs-micro);
  font-weight: var(--fw-semibold);
  letter-spacing: 0.05em;
  color: var(--text-3);
}
.who .when { font-weight: var(--fw-regular); letter-spacing: 0; }

/* 用户消息气泡（.lumir-hp-msg-user > body：--sel 底 + border-soft） */
.msg-user > .body {
  padding: var(--sp-3) var(--sp-4);
  background: var(--sel);
  border: 1px solid var(--border-soft);
  border-radius: var(--r6);
  color: var(--text-2);
}

/* 思考块（.lumir-hp-think）：折叠单行 chevron + 「思考过程 · N 秒」 */
.think-head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  height: 22px;
  color: var(--text-3);
  font-size: var(--fs-meta);
  white-space: nowrap;
}
.think-head svg { flex: none; }

/* 工具调用清单（.lumir-hp-tools）：上下 hairline 夹出的区块 */
.tools {
  margin-top: var(--sp-2);
  padding: var(--sp-2) 0;
  border-top: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border-soft);
}
/* 步骤行（.lumir-hp-tool-row）：24px 高 */
.trow {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 24px;
  font-size: var(--fs-meta);
  color: var(--text-2);
}
.tic {
  width: 14px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
}
.trow.is-done .tic { color: var(--ok); }
.trow.is-rej .tic { color: var(--danger); }
.ttext {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.tn { font-family: var(--mono); }
.ta { font-family: var(--mono); color: var(--text); }
.tout { color: var(--text-3); }
/* 终态词 + 相对时间：flex:none 永不裁（截断只落参数摘要——「保住终态词」与 M373
   「只截 model 名，保住 effort」同一纪律）。 */
.tres { flex: none; color: var(--text-3); white-space: nowrap; }
.tres .tw { color: var(--text-2); font-weight: var(--fw-medium); }
.trow.is-waiting { color: var(--text); }
.pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--run);
  animation: pulse var(--pulse-cycle);
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.35; transform: scale(0.8); }
}
:root[data-theme="eink"] .pulse { animation: pulse-eink 1.4s steps(2, jump-none) infinite; }
@keyframes pulse-eink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ── 批准卡（.lumir-hp-approval 配方）：content-bg + 结构档边框 + r6 ────────── */
.ap {
  padding: var(--sp-3) var(--sp-4);
  background: var(--content-bg);
  border: 1px solid var(--border);
  border-radius: var(--r6);
}
.ap-title {
  margin-bottom: var(--sp-2);
  font-size: var(--fs-ui);
  font-weight: var(--fw-semibold);
}
.ap-sub {
  display: block;
  margin-top: 1px;
  font-size: var(--fs-meta);
  font-weight: var(--fw-regular);
  color: var(--text-3);
}
.ap pre, .term-body pre, .ap-det pre {
  max-height: 240px;
  overflow: auto;
  margin: 0 0 var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  background: var(--code-bg);
  border-radius: var(--r4);
  font-family: var(--mono);
  font-size: var(--fs-label-s);
  line-height: var(--lh-code);
  white-space: pre;
}
:root[data-theme="eink"] .ap pre,
:root[data-theme="eink"] .term-body pre,
:root[data-theme="eink"] .ap-det pre {
  background: var(--preview-bg);
  border: 1px solid var(--border);
}
.ap pre > div, .term-body pre > div { width: max-content; min-width: 100%; }
.d-add { background: var(--ok-tint); color: var(--ok); }
.d-del { background: var(--danger-tint); color: var(--danger); }
.d-hunk { color: var(--text-3); }
.ap-reason {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin-bottom: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r4);
  background: var(--content-bg);
  color: var(--text);
  font: inherit;
  font-size: var(--fs-meta);
  outline: none;
}
.ap-reason:focus { border-color: var(--accent); }
:root[data-theme="eink"] .ap-reason:focus { border-color: var(--border); border-width: 1.6px; }
.ap-actions { display: flex; gap: var(--sp-3); }
.ap-actions button {
  padding: var(--sp-2) var(--sp-5);
  border-radius: var(--r4);
  font-size: var(--fs-meta);
  cursor: pointer;
  transition: background var(--dur-ui) var(--ease-standard);
}
.ap-actions button[data-decide="yes"] {
  border: none;
  background: var(--accent-fill);
  color: var(--accent-fill-text);
}
.ap-actions button[data-decide="no"] {
  border: 1px solid var(--border);
  background: none;
  color: var(--text-2);
}
.ap-actions button[data-decide="no"]:hover { background: var(--hover); color: var(--text); }

/* ── 决策后终态（M384 现行配方）：卡片收敛为一行记录 + 默认折叠的详情 ────────── */
.ap.is-approved, .ap.is-rejected { padding: var(--sp-2) var(--sp-3); }
.ap-rec {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-width: 0;
  font-size: var(--fs-meta);
  color: var(--text-2);
}
.ap-ic {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ok);
}
.ap.is-rejected .ap-ic { color: var(--danger); }
.ap-rec-text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ap-det summary, .term summary .tmore { cursor: pointer; color: var(--text-3); }
.ap-det { margin-top: var(--sp-2); }
.ap-det summary { font-size: var(--fs-meta); list-style: none; }
.ap-det summary::-webkit-details-marker { display: none; }
.ap-det[open] summary { margin-bottom: var(--sp-2); color: var(--text-2); }
.ap-det pre { margin-bottom: 0; }

/* ── 收敛版：待决 = 该行就地展开为批准卡（行头 + 卡体挂在同一单元里） ────────── */
.pend .ap { margin: var(--sp-1) 0 var(--sp-1) 17px; }

/* ── 收敛版：终态行 = 可展开详情（行 = 展开入口；原因行在详情上方常驻可见） ────────── */
details.term summary { list-style: none; }
details.term summary::-webkit-details-marker { display: none; }
details.term > summary.trow { cursor: pointer; }
.termwrap > .trow { cursor: pointer; }
.tmore {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: var(--fs-micro);
}
.tmore svg { transition: transform var(--dur-ui) var(--ease-standard); }
details.term[open] > summary .tmore svg,
.termwrap.is-open > .trow .tmore svg { transform: rotate(90deg); }
.term-body { margin: var(--sp-1) 0 var(--sp-1) 17px; }
.term-body pre { margin-bottom: 0; }
.term-body[hidden] { display: none; }
.term-reason {
  margin: 1px 0 var(--sp-1) 17px;
  font-size: var(--fs-meta);
  color: var(--text-3);
}

/* ── 会话恢复分隔带（原型示意件） ────────── */
.restored-mark {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  color: var(--text-3);
  font-size: var(--fs-micro);
  letter-spacing: 0.04em;
}
.restored-mark::before, .restored-mark::after {
  content: "";
  flex: 1;
  border-top: 1px solid var(--border-soft);
}

/* ── 原型注（教学层，非产品件）：dashed 边框 accent，微字号 ────────── */
.note {
  margin-top: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border: 1px dashed var(--accent);
  border-radius: var(--r4);
  color: var(--text-2);
  font-size: var(--fs-label-s);
  line-height: var(--lh-ui);
}
.note b { color: var(--accent); }
:root[data-theme="eink"] .note { border-color: var(--border); }
:root[data-theme="eink"] .note b { color: var(--text); }

/* ── bug 标记（after-reject 现状帧）：把渲染错位的思考块圈出来 ────────── */
.bug-mark {
  border: 1px dashed var(--danger);
  border-radius: var(--r4);
  padding: 0 var(--sp-2);
}
.bug-tag {
  color: var(--danger);
  font-size: var(--fs-micro);
  line-height: 1.4;
  padding-bottom: var(--sp-1);
}

/* ── composer 极简复刻（静态，只锚定面板语境） ────────── */
.hp-composer-area {
  flex: none;
  padding: var(--sp-3) var(--sp-4) var(--sp-4);
  border-top: 1px solid var(--border);
}
.hp-composer-box {
  background: var(--content-bg);
  border: 1px solid var(--border);
  border-radius: var(--r8);
}
.hp-composer {
  padding: var(--sp-3) var(--sp-4);
  min-height: 40px;
  font-size: var(--fs-ui);
  line-height: var(--lh-ui);
  color: var(--text-3);
}

/* ============ 帧与舞台 ============ */
.stage-only {
  min-height: 100vh;
  padding: 48px 32px 96px;
  background: var(--frame);
}
.stage-head {
  max-width: 800px;
  margin: 0 auto 24px;
}
.stage-head h1 { font-size: 15px; font-weight: var(--fw-bold); letter-spacing: -0.004em; }
.stage-head .sub { margin-top: 4px; font-size: var(--fs-meta); color: var(--text-2); line-height: var(--lh-ui); }
.frames { display: flex; gap: 28px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
.frame-tag {
  margin-bottom: var(--sp-3);
  font-size: var(--fs-meta);
  font-weight: var(--fw-semibold);
  color: var(--text-2);
}
.frame-tag .v-id { font-family: var(--mono); font-weight: var(--fw-regular); color: var(--text-3); font-size: var(--fs-label-s); }
.frame .note { max-width: 348px; }

/* ============ 控制面板（硬规则：全部选项点击可达；panel=0 供截图隐藏） ============ */
.cpanel {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 100;
  width: 280px;
  background: var(--preview-bg);
  border: 1px solid var(--border);
  border-radius: var(--r8);
  box-shadow: var(--shadow-raise);
  padding: 10px 12px;
  font-size: var(--fs-meta);
}
.cpanel[hidden] { display: none; }
.cpanel h2 { font-size: var(--fs-meta); font-weight: var(--fw-bold); margin-bottom: 8px; }
.cpanel .cp-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.cpanel .cp-label { flex: none; width: 40px; color: var(--text-3); font-size: var(--fs-label-s); }
.cpanel .cp-btn {
  padding: 3px 9px;
  border: 1px solid var(--border);
  border-radius: var(--r5);
  font-size: var(--fs-label-s);
  color: var(--text-2);
  cursor: pointer;
  transition: background var(--dur-ui) var(--ease-standard), color var(--dur-ui) var(--ease-standard);
}
.cpanel .cp-btn:hover { background: var(--hover); color: var(--text); }
.cpanel .cp-btn.is-on {
  background: var(--accent-tint);
  color: var(--accent);
  border-color: var(--accent);
}
:root[data-theme="eink"] .cpanel .cp-btn.is-on { background: #000; color: #fff; border-color: #000; }
.cpanel .cp-note { margin-top: 8px; font-size: var(--fs-micro); color: var(--text-3); line-height: 1.5; }

/* ============ board 总览（无参数直开：场景行 + 深链） ============ */
.board-head {
  position: sticky; top: 0; z-index: 5;
  background: var(--frame);
  border-bottom: 1px solid var(--border);
  padding: 14px 32px 12px;
  display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
}
.board-head h1 { font-size: 15px; font-weight: var(--fw-bold); letter-spacing: -0.004em; }
.board-head .themes { display: flex; gap: 10px; font-size: var(--fs-ui-s); }
.board-head .themes b { font-weight: var(--fw-semibold); color: var(--text); }
.board-head .themes a { color: var(--accent); text-decoration: none; }
.board-head .hint { font-size: var(--fs-label-s); color: var(--text-3); }
.board-row {
  display: grid; grid-template-columns: 280px 1fr; gap: 28px;
  padding: 26px 32px; border-bottom: 1px solid var(--border-soft);
  align-items: start;
}
.board-row .meta .v-id { font-family: var(--mono); font-size: var(--fs-label); color: var(--text-3); }
.board-row .meta .v-name { font-size: 13.5px; font-weight: var(--fw-bold); margin: 4px 0 6px; }
.board-row .meta .v-desc { font-size: var(--fs-meta); color: var(--text-2); line-height: 1.55; }
.board-row .meta .v-link { display: inline-block; margin-top: 8px; font-size: var(--fs-label-s); color: var(--accent); text-decoration: none; }
.board-row .stage {
  background: var(--agent-bg);
  border: 1px dashed var(--border);
  border-radius: 10px;
  padding: 24px;
  display: flex; gap: 28px; justify-content: center; align-items: flex-start; flex-wrap: wrap;
}
</style>
</head>

<script>
"use strict";
/* ---- 参数（深链用；全部选项在控制面板点击可达） ---- */
const q = new URLSearchParams(location.search);
const theme = ["light", "dark", "eink"].includes(q.get("theme")) ? q.get("theme") : "light";
document.documentElement.dataset.theme = theme;
const scene = q.get("scene");            // pending | approved | rejected | restored | after-reject
const variant = ["a", "b", "compare"].includes(q.get("variant")) ? q.get("variant") : "compare";
const toolId = TOOL_IDS().includes(q.get("tool")) ? q.get("tool") : "cli_run";
const panelOff = q.get("panel") === "0"; // 截图关控制面板

/* ---- 合成 fixture（全部虚构，零真实 vault 信息） ---- */
const TOOLS = {
  cli_run: {
    name: "cli_run",
    args: 'find 30_项目 -type f -name "*.md" -mtime -7',
    ask: "要运行这条命令吗？",
    sub: "批准后才会在终端运行，输出回到对话里",
    kind: "argv",
    done: "12 个文件",
    lead: "我先扫一遍项目目录，看看这周有哪些笔记动过。",

  },
  vault_create: {
    name: "vault_create",
    args: "30_项目/周报-第41周.md（新建，8 行）",
    ask: "要新建这个文件吗？",
    sub: "批准后才会落盘",
    kind: "diff",
    diff: [
      ["h", "@@ 30_项目/周报-第41周.md（新建） @@"],
      ["+", "+# 周报 · 第 41 周"],
      ["+", "+"],
      ["+", "+## 本周进展"],
      ["+", "+- 里程碑 Alpha 验收通过"],
      ["+", "+- 原型评审完成，待裁决项 2 个"],
      ["+", "+"],
      ["+", "+## 下周计划"],
      ["+", "+- 收敛工具行与批准卡的呈现"],
    ],
    done: "8 行",
    lead: "材料齐了，我把周报生成一个新文件。",
    reason: "先别新建，文件名我想自己定。",
    fallback: "好，不新建。周报草稿我贴在下面，你定好文件名我再落盘。",
  },
  vault_patch: {
    name: "vault_patch",
    args: "30_项目/周报草稿.md（+3 −1）",
    ask: "要修改这个文件吗？",
    sub: "批准后才会落盘",
    kind: "diff",
    diff: [
      ["h", "@@ 30_项目/周报草稿.md @@"],
      [" ", "  ## 本周进展"],
      ["-", "-里程碑 Alpha 待验收"],
      ["+", "+里程碑 Alpha 验收通过"],
      ["+", "+原型评审完成，待裁决项 2 个"],
      ["+", "+工具行与批准卡合并方案已出原型"],
    ],
    done: "+3 −1",
    lead: "我直接在草稿上改这三处。",
    reason: "先别动这个文件，有几处我要自己改。",
    fallback: "好，这个文件我不动。建议的三处改动列在下面，你自己改。",
  },
};
function TOOL_IDS() { return ["cli_run", "vault_create", "vault_patch"]; }
const tool = TOOLS[toolId];

/* ---- 原型内交互态：pending 场景点「批准/拒绝」后就地翻终态（不写 URL） ---- */
const state = { decision: null }; // null | { approved: bool, reason: string|undefined }

/* ---- 图标（1.6px 描边，与产品自绘控件同手法） ---- */
const CHECK_SVG = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5 5 9l4.5-5.5"/></svg>';
const CROSS_SVG = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 3.5l5 5M8.5 3.5l-5 5"/></svg>';
const CHEV_SVG = '<svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 2 7 5 3.5 8"/></svg>';

/* ---- 基础件 ---- */
function who(role, when) {
  return `<div class="who">${role}<span class="when">· ${when}</span></div>`;
}
function msgUser(text, when) {
  return `<div class="msg msg-user">${who("你", when)}<div class="body">${text}</div></div>`;
}
function msgAgent(parts, when) {
  return `<div class="msg msg-agent">${who("AGENT", when)}${parts.join("")}</div>`;
}
function think(sec, bug) {
  const badge = bug ? `<div class="bug-tag">↑ 新一轮的思考，被渲染进批准卡上方的旧消息（bug）</div>` : "";
  return `<div class="think${bug ? " bug-mark" : ""}"><div class="think-head">${CHEV_SVG}<span>思考过程 · ${sec} 秒</span></div>${badge}</div>`;
}
function p(text) { return `<div class="body"><p>${text}</p></div>`; }
function tools(rowsHTML) { return `<div class="tools">${rowsHTML}</div>`; }

/* 工具行文本：人话化摘要（Alex 条目 6）——工具名 mono + 关键参数（命令/文件名）+ 结果读数 */
function ttext(t, tail) {
  return `<span class="ttext"><span class="tn">${t.name}</span> <span class="ta">${t.args}</span>${tail ? ` <span class="tout">${tail}</span>` : ""}</span>`;
}
function rowDone(t) {
  return `<div class="trow is-done"><span class="tic">${CHECK_SVG}</span>${ttext(t, `· ${t.done}`)}</div>`;
}
function rowRejected(t) {
  return `<div class="trow is-rej"><span class="tic">${CROSS_SVG}</span>${ttext(t, "· 已被拒绝")}</div>`;
}
function rowWaiting(t) {
  return `<div class="trow is-waiting"><span class="tic"><span class="pulse"></span></span>${ttext(t, "· 等待批准")}</div>`;
}
function rowRead() {
  return `<div class="trow is-done"><span class="tic">${CHECK_SVG}</span><span class="ttext"><span class="tn">vault_read</span> <span class="ta">30_项目/周报草稿.md</span></span></div>`;
}

/* diff / argv 预览 */
function previewHTML(t) {
  if (t.kind === "argv") return `<pre>${t.args}</pre>`;
  const rows = t.diff.map(([k, line]) => {
    const cls = k === "+" ? "d-add" : k === "-" ? "d-del" : k === "h" ? "d-hunk" : "";
    return `<div${cls ? ` class="${cls}"` : ""}>${line}</div>`;
  }).join("");
  return `<pre>${rows}</pre>`;
}

/* 待决批准卡（两方案共用卡体；A 独立存在，B 挂在行单元内） */
function askCard(t) {
  return `<div class="ap">
    <div class="ap-title">${t.ask}<span class="ap-sub">${t.sub}</span></div>
    ${previewHTML(t)}
    <input class="ap-reason" type="text" placeholder="拒绝原因（可选，会随拒绝回给 Agent）">
    <div class="ap-actions">
      <button type="button" data-decide="yes">批准</button>
      <button type="button" data-decide="no">拒绝</button>
    </div>
  </div>`;
}

/* 决策后终态：A = 现行 M384 收敛记录卡（独立件）；B = 同一行收敛为终态（details 可展开） */
function settledCard(t, approved, when, reason) {
  const cls = approved ? "is-approved" : "is-rejected";
  const ic = approved ? CHECK_SVG : CROSS_SVG;
  const word = approved ? "已采纳" : "已拒绝";
  const reasonLine = !approved && reason ? `<div class="term-reason">原因：${reason}</div>` : "";
  return `<div class="ap ${cls}">
    <div class="ap-rec">
      <span class="ap-ic">${ic}</span>
      <span class="ap-rec-text"><span class="tn">${t.name}</span> <span class="ta">${t.args}</span></span>
      <span class="tres"><b class="tw">${word}</b> · ${when}</span>
    </div>
    ${reasonLine}
    <details class="ap-det"><summary>详情</summary>${previewHTML(t)}</details>
  </div>`;
}
function termRow(t, approved, when, reason) {
  const cls = approved ? "is-done" : "is-rej";
  const ic = approved ? CHECK_SVG : CROSS_SVG;
  const word = approved ? "已采纳" : "已拒绝";
  const reasonLine = !approved && reason ? `<div class="term-reason">原因：${reason}</div>` : "";
  return `<div class="termwrap">
    <div class="trow ${cls}" data-tgl role="button">
      <span class="tic">${ic}</span>
      ${ttext(t, "")}
      <span class="tres"><b class="tw">${word}</b> · ${when}</span>
      <span class="tmore">${CHEV_SVG}详情</span>
    </div>
    ${reasonLine}
    <div class="term-body" hidden>${previewHTML(t)}</div>
  </div>`;
}

/* ---- 场景装配：variant a = 现状双件并存；b = 收敛单行生命周期 ---- */
const USER_MSG = "帮我整理一份本周的项目周报。";
function transcriptHTML(v, sc) {
  const t = tool;
  const leadP = p(t.lead);
  /* 待决（含页内点按钮后的就地翻终态） */
  if (sc === "pending") {
    const d = state.decision;
    if (d) return decidedHTML(v, t, d.approved, "刚刚", d.reason);
    if (v === "a") {
      return msgUser(USER_MSG, "14:02")
        + msgAgent([think(4), leadP, tools(rowRead() + rowWaiting(t))], "14:03")
        + askCard(t);
    }
    return msgUser(USER_MSG, "14:02")
      + msgAgent([think(4), leadP, tools(rowRead() + `<div class="pend">${rowWaiting(t)}${askCard(t)}</div>`)], "14:03");
  }
  if (sc === "approved") return decidedHTML(v, t, true, "刚刚");
  if (sc === "rejected") return decidedHTML(v, t, false, "2 分钟前", t.reason);
  if (sc === "restored") {
    const mark = `<div class="restored-mark">重新打开 · 会话从留存恢复</div>`;
    if (v === "a") {
      return mark
        + msgUser(USER_MSG, "昨天 18:40")
        + msgAgent([leadP, tools(rowRead() + rowDone(t))], "昨天 18:41");
    }
    return mark
      + msgUser(USER_MSG, "昨天 18:40")
      + msgAgent([leadP, tools(rowRead() + termRow(t, true, "昨天 18:41"))], "昨天 18:41");
  }
  /* after-reject：拒绝后的新一轮 */
  const rejRecord = (v === "a")
    ? tools(rowRead() + rowRejected(t))
    : tools(rowRead() + termRow(t, false, "3 分钟前", t.reason));
  if (v === "a") {
    /* bug 复现：新一轮思考被渲染进卡上方的旧消息 */
    return msgUser(USER_MSG, "14:02")
      + msgAgent([think(4), leadP, rejRecord, think(3, true)], "14:03")
      + settledCard(t, false, "3 分钟前", t.reason)
      + msgAgent([p(t.fallback)], "刚刚");
  }
  return msgUser(USER_MSG, "14:02")
    + msgAgent([think(4), leadP, rejRecord], "14:03")
    + msgAgent([think(3), p(t.fallback)], "刚刚");
}
function decidedHTML(v, t, approved, when, reason) {
  const row = approved ? rowDone(t) : rowRejected(t);
  if (v === "a") {
    return msgUser(USER_MSG, "14:02")
      + msgAgent([think(4), p(t.lead), tools(rowRead() + row)], "14:03")
      + settledCard(t, approved, when, reason);
  }
  return msgUser(USER_MSG, "14:02")
    + msgAgent([think(4), p(t.lead), tools(rowRead() + termRow(t, approved, when, reason))], "14:03");
}

/* ---- 每帧的原型注（教学层，页面内 dashed 框） ---- */
const NOTES = {
  "pending:a": "<b>现状</b>：同一个调用两处并存——清单里的 running 行 + 下方独立批准卡。点「批准 / 拒绝」可看两件的各自收敛。",
  "pending:b": "<b>收敛</b>：同一行就地展开为批准卡，清单里只有这一条。点「批准 / 拒绝」看同一行收敛为终态。",
  "approved:a": "<b>现状</b>：批准后两件并存——工具行 ✓ 与卡的终态记录指同一件事，信息重复。",
  "approved:b": "<b>收敛</b>：决策后同一行收敛为终态记录（✓ + 参数摘要 + 已采纳 + 相对时间），不再另存工具行；详情可展开。",
  "rejected:a": "<b>现状</b>：拒绝后同样是两件——失败工具行 + 卡的拒绝记录。",
  "rejected:b": "<b>收敛</b>：同一行收敛为 ✕ 终态，拒绝原因就地可见，diff/argv 收进可展开详情。",
  "restored:a": "<b>现状</b>：批准卡不进留存——恢复后只剩工具行。当初是采纳还是拒绝、原因是什么，无处可查。",
  "restored:b": "<b>收敛</b>：终态行随会话留存——决策、原因、详情恢复后都还在。",
  "after-reject:a": "<b>现状 bug</b>：reject 附原因后，新一轮的思考行被渲染进批准卡上方的旧消息（虚线圈出处），次序反直觉。",
  "after-reject:b": "<b>修复朝向</b>：新一轮的思考与内容落在终态行之后，严格按时间次序。（这个修复与是否收敛正交，现状方案也需要。）",
};

/* ---- 面板帧 ---- */
function panelHTML(v, sc) {
  return `<div class="hp"><div class="hp-transcript">${transcriptHTML(v, sc)}</div>
    <div class="hp-composer-area"><div class="hp-composer-box"><div class="hp-composer">输入消息，试试 / 命令…</div></div></div>
  </div>`;
}
function frameHTML(v, sc) {
  const tag = v === "a"
    ? `<div class="frame-tag">A · 现状：工具行 + 批准卡双件并存 <span class="v-id">variant=a</span></div>`
    : `<div class="frame-tag">B · 收敛：单行生命周期 <span class="v-id">variant=b</span></div>`;
  const note = NOTES[`${sc}:${v}`] ? `<div class="note">${NOTES[`${sc}:${v}`]}</div>` : "";
  return `<div class="frame">${tag}${panelHTML(v, sc)}${note}</div>`;
}

/* ---- 场景元数据 ---- */
const SCENES = {
  "pending":      { name: "待决", desc: "gated 调用等待批准。两种方案都可以点「批准 / 拒绝」现场决策：A 看两件各自收敛，B 看同一行就地收敛为终态。" },
  "approved":     { name: "已批准", desc: "批准之后。A：工具行 ✓ 与卡的终态记录双件并存（信息重复）；B：同一行收敛为终态记录，不另存工具行。" },
  "rejected":     { name: "已拒绝（带原因）", desc: "拒绝并附了原因。A：失败工具行 + 卡的拒绝记录两件；B：单行 ✕ 终态，原因就地可见。" },
  "restored":     { name: "会话恢复后", desc: "重新打开会话。A：批准卡不进留存，只剩工具行，决策与原因无处可查；B：终态行随会话留存。" },
  "after-reject": { name: "拒绝后的新一轮（次序）", desc: "reject 附原因后模型开始新一轮。A 复现已坐实的 bug：新一轮思考被渲染进批准卡上方的旧消息；B 演示修复朝向：思考/新内容落在终态行之后。" },
};

/* ---- 控制面板 ---- */
function go(patch) {
  const p = new URLSearchParams(location.search);
  for (const [k, v] of Object.entries(patch)) p.set(k, v);
  location.search = p.toString();
}
function cpanelHTML() {
  const themeBtns = ["light", "dark", "eink"].map((t) =>
    `<button type="button" class="cp-btn${t === theme ? " is-on" : ""}" data-go="theme:${t}">${t}</button>`).join("");
  const variantBtns = [["compare", "并排对比"], ["a", "仅现状"], ["b", "仅收敛"]].map(([id, name]) =>
    `<button type="button" class="cp-btn${id === variant ? " is-on" : ""}" data-go="variant:${id}">${name}</button>`).join("");
  const sceneBtns = Object.entries(SCENES).map(([id, s]) =>
    `<button type="button" class="cp-btn${id === scene ? " is-on" : ""}" data-go="scene:${id}">${s.name}</button>`).join("");
  const toolBtns = TOOL_IDS().map((id) =>
    `<button type="button" class="cp-btn${id === toolId ? " is-on" : ""}" data-go="tool:${id}">${id}</button>`).join("");
  const resetBtn = state.decision
    ? `<div class="cp-row"><span class="cp-label">调试</span><button type="button" class="cp-btn" id="resetDecision">↺ 重置为待决</button></div>` : "";
  return `<div class="cpanel" id="cpanel" ${panelOff ? "hidden" : ""}>
    <h2>控制面板</h2>
    <div class="cp-row"><span class="cp-label">主题</span>${themeBtns}</div>
    <div class="cp-row"><span class="cp-label">方案</span>${variantBtns}</div>
    <div class="cp-row"><span class="cp-label">状态</span>${sceneBtns}</div>
    <div class="cp-row"><span class="cp-label">工具</span>${toolBtns}</div>
    ${resetBtn}
    <div class="cp-note">全部内容合成 fixture。行内摘要已人话化（两方案同）：cli_run 显示命令与参数、vault_create / vault_patch 显示文件名——对应 Alex 条目 6 的信息密度提升。选项改动写回 URL（可刷新复现）；页内点「批准/拒绝」不写 URL；截图用 ?panel=0 关本面板。</div>
  </div>`;
}

/* ---- 渲染 ---- */
function render() {
  const frames = variant === "compare"
    ? frameHTML("a", scene) + frameHTML("b", scene)
    : frameHTML(variant, scene);
  document.body.innerHTML = `<div class="stage-only">
    <div class="stage-head">
      <h1>${SCENES[scene].name} — harness 工具行 + 批准卡收敛原型</h1>
      <div class="sub">${SCENES[scene].desc}</div>
    </div>
    <div class="frames">${frames}</div>
  </div>${cpanelHTML()}`;
  bind();
}
function bind() {
  document.body.onclick = (e) => {
    const goEl = e.target.closest("[data-go]");
    if (goEl) { const [k, v] = goEl.dataset.go.split(":"); go({ [k]: v }); return; }
    const decEl = e.target.closest("[data-decide]");
    if (decEl) {
      const frame = decEl.closest(".frame");
      const reason = frame ? frame.querySelector(".ap-reason") : null;
      const reasonText = reason && reason.value.trim() ? reason.value.trim() : undefined;
      state.decision = { approved: decEl.dataset.decide === "yes", reason: decEl.dataset.decide === "no" ? reasonText : undefined };
      render();
      return;
    }
    const tglEl = e.target.closest("[data-tgl]");
    if (tglEl) {
      const wrap = tglEl.closest(".termwrap");
      const body = wrap.querySelector(".term-body");
      body.hidden = !body.hidden;
      wrap.classList.toggle("is-open", !body.hidden);
      return;
    }
    if (e.target.id === "resetDecision") { state.decision = null; render(); }
  };
}

/* ---- board 总览 ---- */
function renderBoard() {
  const themeLinks = ["light", "dark", "eink"].map((t) =>
    t === theme ? `<b>${t}</b>` : `<a href="?theme=${t}">${t}</a>`).join(" ");
  const rows = Object.entries(SCENES).map(([id, s]) => `
    <section class="board-row" id="${id}">
      <div class="meta">
        <div class="v-id">scene=${id}</div>
        <div class="v-name">${s.name}</div>
        <div class="v-desc">${s.desc}</div>
        <a class="v-link" href="?scene=${id}&theme=${theme}">单帧（可交互）→</a>
      </div>
      <div class="stage">${frameHTML("a", id)}${frameHTML("b", id)}</div>
    </section>`).join("");
  document.body.innerHTML = `
    <header class="board-head">
      <h1>harness 工具行 + 批准卡收敛 · 原型（M401）</h1>
      <nav class="themes">${themeLinks}</nav>
      <span class="hint">A 现状 = 工具行 + 批准卡双件并存；B 收敛 = 单行生命周期（待决就地展开为卡，决策后同一行收敛为终态）。行内摘要两方案均已人话化（命令 / 文件名）。board 帧为静态（工具固定 cli_run），深链单帧可交互、可切工具与方案。</span>
    </header>
    ${rows}
    <p style="padding:16px 32px;font-size:11.5px;color:var(--text-3)">board 页各帧为静态示意；控制面板在单帧页（场景 / 方案 / 工具 / 主题全部点击可达，query 参数仅作深链）。</p>`;
}

if (scene && SCENES[scene]) {
  render();
  document.title = `${SCENES[scene].name} · ${toolId} · ${variant} — M401 原型`;
} else {
  renderBoard();
}
</script>
</body>
</html>
